<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Balance — your wellness buddy</title>
  <meta name="description" content="Evidence-graded supplements, an AI-built stack, with how to take each one." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght,SOFT@9..144,400..900,30..100&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       Priego — self-hosted (demo .otf shipped in the design pack;
       swap for licensed .woff2 in production).
       ============================================================ */
    @font-face { font-family:'Priego'; font-weight:300; font-style:normal; src:url('/static/fonts/Priego-Light.otf') format('opentype'); font-display:swap; }
    @font-face { font-family:'Priego'; font-weight:400; font-style:normal; src:url('/static/fonts/Priego-Regular.otf') format('opentype'); font-display:swap; }
    @font-face { font-family:'Priego'; font-weight:500; font-style:normal; src:url('/static/fonts/Priego-Medium.otf') format('opentype'); font-display:swap; }
    @font-face { font-family:'Priego'; font-weight:600; font-style:normal; src:url('/static/fonts/Priego-SemiBold.otf') format('opentype'); font-display:swap; }
    @font-face { font-family:'Priego'; font-weight:700; font-style:normal; src:url('/static/fonts/Priego-Bold.otf') format('opentype'); font-display:swap; }
    @font-face { font-family:'Priego'; font-weight:800; font-style:normal; src:url('/static/fonts/Priego-ExtraBold.otf') format('opentype'); font-display:swap; }

    /* Tokens copied verbatim from Balance App v2.html so the imported
       screen JSX renders unchanged. */
    :root {
      --bg: #ffffff; --bg-2: #f7f7f7;
      --surface: #ffffff; --surface-2: #fafafa; --surface-3: #f0f0f3;
      --ink: #050304; --ink-2: #3d3d3d; --ink-3: #7f7f7f; --ink-4: #a6a6a6;
      --rule: #e5e5e5;

      --c-cyan: #56b6c6; --c-blue: #3fa9f5; --c-indigo: #559bf0;
      --c-violet: #8e77e2; --c-magenta: #e978da; --c-pink: #f3a9fd;

      --brand: #5521e5; --brand-deep: #20056c; --brand-soft: #ece5fc;
      --accent: #e978da; --accent-soft: #fde2f8;
      --aqua: #56b6c6; --green: #7ac97f; --green-soft: #d8f1da;

      --grad-balance: linear-gradient(95deg, #56b6c6 0%, #3fa9f5 22%, #559bf0 38%, #8e77e2 56%, #e978da 78%, #f3a9fd 100%);
      --grad-radial: radial-gradient(circle at 30% 30%, #f3a9fd 0%, #e978da 18%, #8e77e2 38%, #559bf0 60%, #3fa9f5 80%, #56b6c6 100%);

      --r-sm: 12px; --r-md: 18px; --r-lg: 26px; --r-xl: 32px;
      --sh-1: 0 1px 2px rgba(32,5,108,0.05), 0 2px 8px rgba(32,5,108,0.05);
      --sh-2: 0 8px 24px rgba(32,5,108,0.08);
      --sh-card: 0 1px 0 rgba(32,5,108,0.03), 0 8px 28px rgba(32,5,108,0.06);

      /* The original v2 JSX references aliased names for the legacy palette */
      --forest-ink: #050304; --forest-2: #20056c; --forest: #5521e5;
      --moss-2: #ece5fc; --moss: #8e77e2;
      --sage-2: #ece5fc; --sage: #ece5fc;
      --clay-soft: #fde2f8; --clay-2: #f3a9fd; --clay: #e978da;
      --ochre-soft: #d8f1da; --ochre: #7ac97f;
      --violet: #8e77e2;
      --grade-a: #5521e5; --grade-b: #8e77e2; --grade-c: #e978da;
    }

    html, body { margin:0; padding:0; background:#fafafa; }
    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Single-screen phone container.
       - Phone-frame chrome on wide viewports.
       - Edge-to-edge on actual mobile so the app feels native. */
    .phone-frame {
      width: 100%;
      max-width: 100vw;
      min-height: 100vh;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }
    @media (min-width: 540px) {
      body {
        background:
          radial-gradient(circle at 80% 0%, rgba(243,169,253,0.08) 0%, transparent 50%),
          radial-gradient(circle at 0% 60%, rgba(86,182,198,0.06) 0%, transparent 50%),
          #fafafa;
        display: flex; align-items: center; justify-content: center;
        padding: 24px 16px;
      }
      .phone-frame {
        width: 390px; height: 844px;
        max-width: 100%;
        border-radius: 54px;
        padding: 10px;
        background: #111;
        box-shadow: 0 30px 60px rgba(26,31,28,0.18), 0 0 0 1px rgba(26,31,28,0.08);
        min-height: 0;
      }
      .phone-inner {
        width: 100%; height: 100%;
        border-radius: 46px;
        overflow: hidden;
        position: relative;
        background: var(--bg);
      }
      .dyn-island {
        position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
        width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 100;
      }
    }
    @media (max-width: 539px) {
      .phone-inner { width: 100%; min-height: 100vh; position: relative; }
      .dyn-island { display: none; }
    }

    /* These need to be reachable from the screen JSX (which uses
       .screen-root, .serif, etc.). Copied from v2.html top. */
    .screen-root {
      height: 100%; background: var(--bg); color: var(--ink);
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      font-size: 15px; line-height: 1.35; letter-spacing: -0.01em;
      overflow: hidden; position: relative;
    }
    @media (max-width: 539px) {
      .screen-root { height: 100vh; }
    }
    .screen-root * { box-sizing: border-box; }
    .serif { font-family: 'Priego', 'Fraunces', 'Iowan Old Style', Georgia, serif; font-weight: 600; letter-spacing: -0.02em; }
    .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .scroll { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    .scroll::-webkit-scrollbar { display: none; }
    .bal-pill { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:600; letter-spacing:.02em; background: var(--brand-soft); color: var(--brand-deep); }
    .bal-pill.accent { background: var(--accent-soft); color: var(--brand); }
    .bal-pill.dark   { background: var(--brand); color: white; }
    .bal-pill.light  { background: var(--surface-3); color: var(--ink-2); }
    .ev-badge { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:7px; font-size:11px; font-weight:700; font-family:'Priego','Fraunces',Georgia,serif; }
    .ev-badge.a { background: var(--brand);  color: white; }
    .ev-badge.b { background: var(--accent); color: white; }
    .ev-badge.c { background: var(--accent-soft); color: var(--brand); }
    .bal-card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-card); }
    .tabbar { position:absolute; left:0; right:0; bottom:0; background: rgba(255,255,255,.92); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border-top: 0.5px solid var(--rule); padding: 10px 20px 28px; display:flex; justify-content:space-around; z-index: 10; }
    .tab-item { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-weight:600; color: var(--ink-4); letter-spacing:.02em; cursor:pointer; }
    .tab-item.active { color: var(--brand); }
    .tab-item svg { width:22px; height:22px; }

    .bal-mark { display:inline-flex; align-items:baseline; gap:2px; font-family:'Priego','Fraunces',Georgia,serif; font-weight:700; letter-spacing:-.04em; }
    .bal-mark .a  { background: var(--grad-radial); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .bal-mark .ai { font-size: .45em; vertical-align: super; margin-left: 1px; background: var(--grad-radial); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:700; }

    /* Category screen styles (the AI-content surface I add on top of the design) */
    @keyframes balShimmer {
      0% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
    }
    .cat-skel {
      background: linear-gradient(90deg, var(--surface-3) 0%, #E8E8EE 50%, var(--surface-3) 100%);
      background-size: 400% 100%;
      animation: balShimmer 1.4s ease-in-out infinite;
      border-radius: 12px;
    }
  </style>

  <!-- React + ReactDOM + Babel (in-browser JSX, matches what the design package shipped with). -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

  <!-- The brand library (logo + 8 extra screens) loaded verbatim from the design package. -->
  <script type="text/babel" src="/static/logo.jsx"></script>
  <script type="text/babel" src="/static/screens-extra.jsx"></script>
  <!-- Core 7 screens (Icon, Tabbar, Home, Ask, Stack, Learn, Detail, Progress, Onboard) extracted from Balance App v2.html. -->
  <script type="text/babel" src="/static/screens-core.jsx"></script>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-inner">
      <div class="dyn-island"></div>
      <div id="root" style="height:100%;"></div>
    </div>
  </div>

  <script type="text/babel" data-presets="env,react">
    /* ============================================================
       Balance app shell.
       - Tracks the active screen.
       - Implements window.__bal_nav so all the design screens'
         Tabbars and back/link buttons drive a real router.
       - Adds a CategoryScreen that calls /api/category/{slug} and
         renders the AI-generated PROBLEMS / WHAT YOU CAN DO /
         tiered supplement stack with iHerb buy links — i.e. the
         "texts we improved" living inside the new design chrome.
       ============================================================ */

    const { useState, useEffect, useCallback, useMemo } = React;

    // Slug ↔ display + icon mapping. Slugs match BM25 sources in the backend
    // so any tile triggers a working /api/category/{slug} call. Memory &
    // Focus is the slug we've verified end-to-end; the others use the same
    // schema and will Just Work but may surface a 10s first-call latency.
    const TOPICS = [
      { slug:'sleep',                 name:'Sleep',         icon:'Moon',     grade:'A' },
      { slug:'stress-anxiety',        name:'Stress',        icon:'Leaf',     grade:'A' },
      { slug:'memory-focus',          name:'Memory & Focus',icon:'Brain',    grade:'B', live:true },
      { slug:'mood-depression',       name:'Mood',          icon:'Sun',      grade:'B' },
      { slug:'muscle-gain',           name:'Muscle',        icon:'Dumbbell', grade:'A' },
      { slug:'fat-loss',              name:'Fat loss',      icon:'Flame',    grade:'B' },
      { slug:'cardiovascular-health', name:'Heart',         icon:'Heart',    grade:'A' },
      { slug:'joint-health',          name:'Joints',        icon:'Bone',     grade:'B' },
      { slug:'allergies-immunity',    name:'Immunity',      icon:'Shield',   grade:'B' },
      { slug:'skin-hair-nails',       name:'Skin',          icon:'Droplet',  grade:'C' },
      { slug:'libido',                name:'Libido',        icon:'Spark',    grade:'B' },
      { slug:'liver-health',          name:'Liver',         icon:'Leaf',     grade:'B' },
      { slug:'bone-health',           name:'Bones',         icon:'Bone',     grade:'B' },
      { slug:'blood-sugar',           name:'Blood sugar',   icon:'Droplet',  grade:'B' },
      { slug:'testosterone',          name:'Testosterone',  icon:'Flame',    grade:'B' },
      { slug:'recovery-wellness',     name:'Recovery',      icon:'Heart',    grade:'B' },
      { slug:'vegetarians-vegans',    name:'Vegetarian',    icon:'Leaf',     grade:'B' },
      { slug:'healthy-aging',         name:'Aging',         icon:'Sun',      grade:'B' },
    ];
    const TOPIC_BY_SLUG = Object.fromEntries(TOPICS.map(t => [t.slug, t]));

    // -------------------------------------------------------------
    // MyLearnScreen — replaces the design's hardcoded 12-tile Learn
    // with all 18 real category slugs the backend has data for.
    // Visuals match the design (3-col grid, tinted icon tiles).
    // -------------------------------------------------------------
    const MyLearnScreen = ({ onOpen }) => {
      const { Icon, Tabbar } = window;
      return (
        <div className="screen-root">
          <div className="scroll" style={{height:'100%', paddingBottom: 130}}>
            <div style={{height: 54}}/>
            <div style={{padding:'8px 22px'}}>
              <div className="serif" style={{fontSize:34, lineHeight:1, color:'var(--ink)'}}>Learn</div>
              <div style={{fontSize:13, color:'var(--ink-3)', marginTop:4}}>{TOPICS.length} evidence-based guides</div>
            </div>

            {/* Search (visual only) */}
            <div style={{padding:'14px 18px 0'}}>
              <div style={{background:'var(--surface)', borderRadius:14, padding:'10px 14px', display:'flex', alignItems:'center', gap:10, boxShadow:'var(--sh-1)'}}>
                <Icon.Search size={16} c="var(--ink-3)"/>
                <div style={{flex:1, fontSize:14, color:'var(--ink-3)'}}>Search guides or supplements</div>
              </div>
            </div>

            {/* Featured guide → opens Memory & Focus (the verified one) */}
            <div style={{padding:'16px 18px 0', cursor:'pointer'}} onClick={() => onOpen('memory-focus')}>
              <div className="bal-card" style={{padding:0, overflow:'hidden', position:'relative'}}>
                <div style={{padding:'18px 18px 16px', background:'linear-gradient(140deg, var(--brand-soft) 0%, #d6cffa 100%)', position:'relative', minHeight:140}}>
                  <div style={{fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--brand-deep)', fontWeight:600}}>Featured guide</div>
                  <div className="serif" style={{fontSize:28, lineHeight:1.18, marginTop:10, color:'var(--ink)', maxWidth:'68%', paddingBottom:4}}>
                    Memory &amp; Focus, <em>backed by studies</em>
                  </div>
                  <div style={{fontSize:13, color:'var(--brand-deep)', marginTop:16}}>AI-built stack · iHerb links · 1-tap</div>
                  <div style={{position:'absolute', right:-10, bottom:-20, width:130, height:130, borderRadius:'50%', background:'rgba(85,33,229,0.10)'}}/>
                  <div style={{position:'absolute', right:24, bottom:18}}>
                    <Icon.Brain size={44} c="var(--brand)"/>
                  </div>
                </div>
              </div>
            </div>

            {/* All 18 topics */}
            <div style={{padding:'22px 18px 0'}}>
              <div style={{fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--ink-3)', fontWeight:600, marginBottom:12}}>All {TOPICS.length} topics</div>
              <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10}}>
                {TOPICS.map((t, i) => {
                  const Ic = Icon[t.icon];
                  return (
                    <div key={i} className="bal-card" style={{padding:14, aspectRatio:'1', display:'flex', flexDirection:'column', justifyContent:'space-between', cursor:'pointer'}} onClick={() => onOpen(t.slug)}>
                      <div style={{width:32, height:32, borderRadius:10, background:'var(--brand-soft)', display:'flex', alignItems:'center', justifyContent:'center'}}>
                        {Ic && <Ic size={18} c="var(--brand)"/>}
                      </div>
                      <div>
                        <div style={{fontSize:14, fontWeight:600, color:'var(--ink)'}}>{t.name}</div>
                        <div style={{fontSize:11, color:'var(--ink-3)', marginTop:2}}>Grade {t.grade}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
          <Tabbar active="browse" onNav={window.__bal_nav}/>
        </div>
      );
    };

    // -------------------------------------------------------------
    // CategoryScreen — the AI-content surface. Hero in brand gradient,
    // two cards (Problems, What you can do), then tiered supplement
    // list with iHerb buy buttons. This is where the "texts we
    // improved" live, dropped into the new design chrome.
    // -------------------------------------------------------------
    const TIERS = ['Primary', 'Secondary', 'Promising'];
    const TIER_BADGE = { Primary:'a', Secondary:'b', Promising:'c' };

    const ExternalIcon = ({size=12, c='currentColor'}) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
        <path d="M14 5h5v5"/><path d="M19 5l-9 9"/><path d="M19 14v5H5V5h5"/>
      </svg>
    );

    const CategorySkeleton = () => (
      <div style={{padding:'14px 18px'}}>
        {[0,1,2].map(i => (
          <div key={i} className="cat-skel" style={{height: i===0 ? 88 : 64, marginBottom: 12}}/>
        ))}
      </div>
    );

    const CategoryScreen = ({ slug, data, loading, error, onBack }) => {
      const { Icon, Tabbar } = window;
      const topic = TOPIC_BY_SLUG[slug] || { name: 'Guide' };
      const title = data?.title || topic.name;
      // Split the title so the second word is italic, matching the design's
      // editorial-display feel ("Memory & Focus" → "Memory" / "& Focus" italic).
      const parts = title.split(' ');
      const head1 = parts[0];
      const headRest = parts.slice(1).join(' ');

      // Group supplements by tier, preserving Primary→Secondary→Promising order.
      const byTier = useMemo(() => {
        const acc = { Primary: [], Secondary: [], Promising: [] };
        (data?.supplements || []).forEach(s => { if (acc[s.tier]) acc[s.tier].push(s); });
        return acc;
      }, [data]);

      return (
        <div className="screen-root">
          <div className="scroll" style={{height:'100%', paddingBottom: 110}}>
            {/* Hero */}
            <div style={{background:'linear-gradient(160deg, var(--brand) 0%, var(--brand-deep) 100%)', color:'white', padding:'18px 22px 30px', position:'relative', overflow:'hidden'}}>
              <div style={{position:'absolute', top:-60, right:-40, width:200, height:200, borderRadius:'50%', background:'rgba(243,169,253,0.10)'}}/>
              <div style={{position:'absolute', bottom:-80, left:-40, width:240, height:240, borderRadius:'50%', background:'rgba(86,182,198,0.08)'}}/>
              <div style={{height:54}}/>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', position:'relative', zIndex:1}}>
                <div onClick={onBack} style={{width:36, height:36, borderRadius:'50%', background:'rgba(255,255,255,0.14)', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer'}}>
                  <Icon.Back size={16} c="white"/>
                </div>
                <a href="/chat" style={{width:36, height:36, borderRadius:'50%', background:'rgba(255,255,255,0.14)', display:'flex', alignItems:'center', justifyContent:'center', textDecoration:'none'}}>
                  <Icon.Spark size={18} c="white"/>
                </a>
              </div>
              <div style={{fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--accent-soft)', marginTop:22, fontWeight:600, position:'relative'}}>Evidence-based guide</div>
              <div className="serif" style={{fontSize:40, lineHeight:1.06, marginTop:8, position:'relative'}}>
                {head1}{headRest && <> <em style={{fontStyle:'italic', color:'var(--accent-soft)'}}>{headRest}</em></>}
              </div>
              <div style={{fontSize:14, color:'rgba(255,255,255,0.78)', marginTop:8, maxWidth:'92%', position:'relative'}}>
                An AI-built stack from the supplement guide — tiered by evidence, with how to take each one and a link to iHerb.
              </div>
            </div>

            {error && (
              <div style={{margin:'18px 22px', padding:'14px 16px', background:'var(--accent-soft)', color:'var(--brand-deep)', borderRadius:12, fontSize:13}}>
                Couldn't load this guide: {error}
              </div>
            )}

            {/* Problems */}
            <div style={{padding:'22px 22px 6px'}}>
              <div className="serif" style={{fontSize:22, marginBottom:12, color:'var(--ink)'}}>
                What hurts <em style={{fontStyle:'italic', color:'var(--brand)'}}>{title.toLowerCase()}</em>
              </div>
              <div className="bal-card" style={{padding:'4px 0'}}>
                {(loading || !data) ? <CategorySkeleton/> : (data.problems || []).map((p, i, arr) => (
                  <div key={i} style={{display:'flex', gap:14, padding:'16px 18px', borderBottom: i<arr.length-1 ? '0.5px solid var(--rule)' : 'none'}}>
                    <div style={{width:26, height:26, borderRadius:8, background:'var(--brand-soft)', color:'var(--brand)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0}} className="mono" >
                      <span style={{fontSize:12, fontWeight:600}}>{String(i+1).padStart(2,'0')}</span>
                    </div>
                    <div>
                      <div style={{fontSize:15, fontWeight:600, color:'var(--ink)'}}>{p.title}</div>
                      <div style={{fontSize:13, color:'var(--ink-2)', marginTop:2, lineHeight:1.45}}>{p.description}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* What you can do */}
            <div style={{padding:'22px 22px 6px'}}>
              <div className="serif" style={{fontSize:22, marginBottom:12, color:'var(--ink)'}}>What you can <em style={{fontStyle:'italic', color:'var(--brand)'}}>do</em></div>
              <div className="bal-card" style={{padding:'4px 0'}}>
                {(loading || !data) ? <CategorySkeleton/> : (data.what_you_can_do || []).map((l, i, arr) => (
                  <div key={i} style={{display:'flex', gap:14, padding:'16px 18px', borderBottom: i<arr.length-1 ? '0.5px solid var(--rule)' : 'none'}}>
                    <div style={{width:26, height:26, borderRadius:8, background:'var(--accent-soft)', color:'var(--brand)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0}} className="mono">
                      <span style={{fontSize:12, fontWeight:600}}>{String(i+1).padStart(2,'0')}</span>
                    </div>
                    <div>
                      <div style={{fontSize:15, fontWeight:600, color:'var(--ink)'}}>{l.title}</div>
                      <div style={{fontSize:13, color:'var(--ink-2)', marginTop:2, lineHeight:1.45}}>{l.description}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Recommended stack — tier-grouped supplements with iHerb buttons */}
            <div style={{padding:'24px 22px 6px'}}>
              <div className="serif" style={{fontSize:22, marginBottom:6, color:'var(--ink)'}}>
                Recommended <em style={{fontStyle:'italic', color:'var(--brand)'}}>stack</em>
              </div>
              <div style={{fontSize:13, color:'var(--ink-3)', marginBottom:14}}>Tiered by evidence in the guide. Unproven supplements are filtered out.</div>

              {(loading || !data) && <CategorySkeleton/>}

              {data && TIERS.map(t => byTier[t].length > 0 && (
                <div key={t} style={{marginBottom:18}}>
                  <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:10}}>
                    <div className={`ev-badge ${TIER_BADGE[t]}`}>{t[0]}</div>
                    <div className="mono" style={{fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', fontWeight:600, color:'var(--ink-2)'}}>{t} supplements</div>
                  </div>
                  {byTier[t].map((s, i) => (
                    <div key={i} className="bal-card" style={{padding:'14px 16px', marginBottom:10}}>
                      <div style={{display:'flex', alignItems:'baseline', justifyContent:'space-between', gap:10}}>
                        <div style={{fontSize:16, fontWeight:600, color:'var(--ink)'}}>{s.name}</div>
                        {s.form && <div style={{fontStyle:'italic', color:'var(--ink-3)', fontSize:12}}>{s.form}</div>}
                      </div>
                      <div style={{display:'flex', flexWrap:'wrap', gap:8, marginTop:8}}>
                        <span className="bal-pill light mono" style={{fontSize:11}}>{s.dose}</span>
                        {s.timing && <span className="bal-pill light mono" style={{fontSize:11}}>{s.timing}</span>}
                      </div>
                      {s.evidence && <div style={{fontSize:13, color:'var(--ink-2)', lineHeight:1.45, marginTop:8}}>{s.evidence}</div>}
                      <a href={s.iherb_url} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex', alignItems:'center', gap:6, marginTop:10, padding:'8px 14px', background:'var(--brand)', color:'white', borderRadius:999, textDecoration:'none', fontSize:13, fontWeight:600}}>
                        Buy on iHerb <ExternalIcon/>
                      </a>
                    </div>
                  ))}
                </div>
              ))}

              <div style={{fontSize:11, color:'var(--ink-3)', textAlign:'center', padding:'18px 8px 24px', lineHeight:1.5}}>
                Always check with your healthcare provider before starting any new supplement, especially if you take medication or have a health condition.
              </div>
            </div>
          </div>
          <Tabbar active="browse" onNav={window.__bal_nav}/>
        </div>
      );
    };

    // -------------------------------------------------------------
    // Root: holds current-screen state, wires window.__bal_nav for
    // every imported screen's Tabbar/back/link buttons, and fetches
    // the category content on demand.
    // -------------------------------------------------------------
    const Root = () => {
      const [screen, setScreen] = useState('home');
      const [slug, setSlug] = useState('memory-focus');
      const [cache, setCache] = useState({});  // slug -> {data, loading, error}

      // Map design Tabbar keys → real screens.
      const navTo = useCallback((k) => {
        const map = {
          home: 'home', ask: 'ask', stack: 'stack',
          browse: 'learn', me: 'profile',
          detail: 'detail', add: 'add', signin: 'signin', onboard: 'onboard',
          intake: 'intake', progress: 'progress', reminders: 'reminders',
          history: 'history', learn: 'learn', labs: 'labs',
          profile: 'profile', paywall: 'paywall',
        };
        setScreen(map[k] || 'home');
        if (window.location.hash) history.replaceState(null, '', window.location.pathname);
      }, []);

      const openCategory = useCallback((s) => {
        setSlug(s);
        setScreen('category');
        history.replaceState(null, '', '#/category/' + s);
      }, []);

      // Install global hooks the imported design screens use to navigate.
      useEffect(() => {
        window.__bal_nav = navTo;
        window.__bal_open_category = openCategory;
      }, [navTo, openCategory]);

      // Hash deep-link: #/category/<slug> opens that category directly.
      useEffect(() => {
        const handle = () => {
          const m = window.location.hash.match(/^#\/category\/([\w-]+)$/);
          if (m) { setSlug(m[1]); setScreen('category'); }
        };
        window.addEventListener('hashchange', handle);
        handle();
        return () => window.removeEventListener('hashchange', handle);
      }, []);

      // Fetch on entering category, cache by slug.
      useEffect(() => {
        if (screen !== 'category') return;
        if (cache[slug]?.data || cache[slug]?.loading) return;
        setCache(c => ({ ...c, [slug]: { loading: true } }));
        fetch('/api/category/' + slug)
          .then(async r => {
            if (!r.ok) {
              let msg = 'HTTP ' + r.status;
              try { const j = await r.json(); msg = j.detail || msg; } catch {}
              throw new Error(msg);
            }
            return r.json();
          })
          .then(data => setCache(c => ({ ...c, [slug]: { data } })))
          .catch(err => setCache(c => ({ ...c, [slug]: { error: String(err.message || err) } })));
      }, [screen, slug]);

      const SCREENS = {
        signin:    window.SignInScreen,
        onboard:   window.OnboardScreen,
        intake:    window.IntakeScreen,
        home:      window.HomeScreen,
        progress:  window.ProgressScreen,
        reminders: window.RemindersScreen,
        ask:       window.AskScreen,
        history:   window.ChatHistoryScreen,
        detail:    window.DetailScreen,
        add:       window.AddSuppScreen,
        labs:      window.LabsScreen,
        stack:     window.StackScreen,
        profile:   window.ProfileScreen,
        paywall:   window.PaywallScreen,
      };

      if (screen === 'learn') return <MyLearnScreen onOpen={openCategory}/>;
      if (screen === 'category') {
        const c = cache[slug] || {};
        return <CategoryScreen slug={slug} data={c.data} loading={c.loading} error={c.error} onBack={() => setScreen('learn')}/>;
      }
      const C = SCREENS[screen] || SCREENS.home;
      return C ? <C/> : <div style={{padding:40, fontFamily:'Inter', color:'#666'}}>Loading…</div>;
    };

    // Wait until every component the screens depend on is registered.
    const REQUIRED = ['Icon','Tabbar','BalLogo','BalLogoMark',
      'HomeScreen','AskScreen','StackScreen','LearnScreen','DetailScreen','ProgressScreen','OnboardScreen',
      'SignInScreen','IntakeScreen','AddSuppScreen','RemindersScreen','ChatHistoryScreen','LabsScreen','ProfileScreen','PaywallScreen'];

    const mountWhenReady = () => {
      const missing = REQUIRED.filter(n => !window[n]);
      if (missing.length) {
        // Babel-in-browser is asynchronous; the external <script type="text/babel" src=>
        // files load and transform in parallel, so we poll until all globals exist.
        return setTimeout(mountWhenReady, 60);
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
    };
    mountWhenReady();
  </script>
</body>
</html>

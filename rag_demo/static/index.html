<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Balance.ai — Supplement RAG (Demo)</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #14171f;
    --border: #242836;
    --text: #e7e9ee;
    --muted: #8a93a6;
    --accent: #6ea8ff;
    --user: #1e2633;
    --bot: #161b26;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .tag { color: var(--muted); font-size: 12px; }
  #chat {
    flex: 1; overflow-y: auto; padding: 24px;
    max-width: 820px; width: 100%; margin: 0 auto;
  }
  .msg { margin: 0 0 18px; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--border); }
  .msg.user { background: var(--user); }
  .msg.bot { background: var(--bot); }
  .msg .role { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
  .msg .content { white-space: pre-wrap; }
  .citations { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 13px; }
  .citations .cite { color: var(--muted); margin-bottom: 6px; }
  .citations .cite b { color: var(--accent); font-weight: 600; }
  .linkouts { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 13px; }
  .linkouts .lo-title { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; margin-bottom: 6px; }
  .linkouts a { display: inline-block; margin: 0 8px 6px 0; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; color: var(--accent); text-decoration: none; }
  .linkouts a:hover { border-color: var(--accent); }
  .attribution { color: var(--muted); font-size: 11px; margin-top: 8px; }
  .attribution a { color: var(--muted); }
  form {
    border-top: 1px solid var(--border); padding: 16px 24px;
    max-width: 820px; width: 100%; margin: 0 auto; display: flex; gap: 8px;
  }
  input[type=text] {
    flex: 1; padding: 12px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    font-size: 15px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    padding: 12px 18px; border-radius: 8px; border: 0;
    background: var(--accent); color: #0b0d12; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .hint { color: var(--muted); font-size: 13px; padding: 8px 24px 0; max-width: 820px; margin: 0 auto; width: 100%; }
</style>
</head>
<body>
  <header>
    <h1>Balance.ai — Supplement Guide RAG</h1>
    <span class="tag">demo / GPT-4o + 17 guides</span>
  </header>
  <div class="hint">Ask anything about sleep, stress, testosterone, joints, liver, blood sugar, muscle gain, fat loss, libido, memory, mood, skin/hair/nails, bones, cardiovascular, healthy aging, allergies/immunity, or vegetarian/vegan supplementation.</div>
  <div id="chat"></div>
  <form id="f">
    <input id="q" type="text" placeholder="e.g. What helps with sleep onset?" autocomplete="off" />
    <button id="send" type="submit">Ask</button>
  </form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('f');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');

function add(role, content, citations, examineLinks) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  const r = document.createElement('div');
  r.className = 'role';
  r.textContent = role === 'user' ? 'You' : 'Balance.ai';
  const c = document.createElement('div');
  c.className = 'content';
  c.textContent = content;
  el.appendChild(r);
  el.appendChild(c);
  if (citations && citations.length) {
    const cdiv = document.createElement('div');
    cdiv.className = 'citations';
    for (const cit of citations) {
      const line = document.createElement('div');
      line.className = 'cite';
      line.innerHTML = `<b>${cit.source}</b> — ${cit.snippet}`;
      cdiv.appendChild(line);
    }
    el.appendChild(cdiv);
  }
  if (examineLinks && examineLinks.length) {
    const ldiv = document.createElement('div');
    ldiv.className = 'linkouts';
    const title = document.createElement('div');
    title.className = 'lo-title';
    title.textContent = 'Learn more on Examine';
    ldiv.appendChild(title);
    for (const link of examineLinks) {
      const a = document.createElement('a');
      a.href = link.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = link.name + ' ↗';
      ldiv.appendChild(a);
    }
    const attr = document.createElement('div');
    attr.className = 'attribution';
    attr.innerHTML = 'Guide content sourced from <a href="https://examine.com" target="_blank" rel="noopener noreferrer">Examine.com</a>.';
    ldiv.appendChild(attr);
    el.appendChild(ldiv);
  }
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  add('user', q);
  input.value = '';
  sendBtn.disabled = true;
  const thinking = add('bot', 'Thinking...');
  try {
    const r = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q}),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    thinking.remove();
    add('bot', data.answer, data.citations, data.examine_links);
  } catch (err) {
    thinking.remove();
    add('bot', 'Error: ' + err.message);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
input.focus();
</script>
</body>
</html>

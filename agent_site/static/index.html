    .bal-card { background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--sh-card); }

    SUPP_DETECT.forEach(s => {
      s._res = s.words.map(w => new RegExp('(?:^|[^a-z0-9])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:[^a-z0-9]|$)'));

            </button>
          </div>
        </div>
      );
    };

    // ============ Home ============
    const Home = ({ goals, stack, taken, onToggleTaken, onOpenCategory, onAsk, onNav }) => {
      const { Icon, Tabbar } = window;
      const goalTopics = goals.map(s => TOPIC_BY_SLUG[s]).filter(Boolean);
      const doneCount = stack.filter(s => taken.includes(s.name)).length;
      // Classic flow has no onboarding, so Home must look populated for a fresh
      // user: fall back to a featured set when no goals have been picked yet.
      const FEATURED_SLUGS = ['sleep','memory-focus','stress-anxiety','muscle-gain','cardiovascular-health','joint-health'];
      const featured = FEATURED_SLUGS.map(s => TOPIC_BY_SLUG[s]).filter(Boolean);
      const hasGoals = goalTopics.length > 0;
      const heroTopic = goalTopics[0] || TOPIC_BY_SLUG['memory-focus'];
      const chipTopics = hasGoals ? goalTopics.slice(0,3) : featured.slice(0,3);
      const gridTopics = hasGoals ? goalTopics : featured;
      return (
        <div className="screen-root">
          <div className="scroll" style={{height:'100%', paddingBottom:96}}>
            <div style={{height:48}}/>
            <div style={{padding:'6px 22px 4px', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
              <div>
                <div style={{fontSize:12, color:'var(--ink-3)', fontWeight:500, letterSpacing:'0.06em', textTransform:'uppercase'}}>{new Date().toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'})}</div>
                <div className="serif" style={{fontSize:32, lineHeight:1.05, marginTop:2, color:'var(--ink)'}}>{greeting()},<br/><em style={{fontStyle:'italic'}}>there</em>.</div>
              </div>
              <button onClick={()=>onNav('me')} style={{width:40, height:40, borderRadius:'50%', background:'var(--brand)', color:'white', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:600, border:'none'}}>Y</button>
            </div>

            <div style={{padding:'8px 18px 0'}}>
              <button onClick={()=>onOpenCategory(heroTopic.slug)} style={{display:'block', width:'100%', textAlign:'left', border:'none', background:'var(--brand)', color:'var(--brand-soft)', padding:18, borderRadius:22, position:'relative', overflow:'hidden'}}>
                <div style={{position:'absolute', right:-30, top:-30, width:160, height:160, borderRadius:'50%', background:'rgba(243,169,253,0.10)'}}/>
                <div style={{position:'absolute', right:18, top:18}}><window.BalLogoMark size={36} dark/></div>
                <div style={{position:'relative'}}>
                  <div style={{fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--brand-soft)', fontWeight:600}}>{hasGoals ? "Today's focus" : 'Featured guide'}</div>
                  <div className="serif" style={{fontSize:26, lineHeight:1.15, marginTop:10, maxWidth:'78%', color:'white'}}>Build your <em>{heroTopic.name}</em> stack.</div>
                  <div style={{fontSize:13, color:'var(--brand-soft)', marginTop:10, maxWidth:'82%'}}>An AI-built, evidence-graded stack with how to take each one.</div>
                  <div style={{display:'inline-flex', gap:8, marginTop:14, alignItems:'center', background:'rgba(255,255,255,0.14)', padding:'6px 12px', borderRadius:999}}>
                    <span style={{fontSize:12, color:'white', fontWeight:600}}>Open guide</span><Icon.Chevron size={12} c="white"/>
                  </div>
                </div>
              </button>
            </div>

            <div style={{padding:'12px 18px 0'}}>
              <button onClick={()=>onNav('ask')} style={{width:'100%', textAlign:'left', border:'none', background:'var(--surface)', boxShadow:'var(--sh-card)', borderRadius:'var(--r-lg)', padding:'14px 16px', display:'flex', alignItems:'center', gap:12}}>
                <div style={{width:28, height:28, borderRadius:'50%', background:'var(--accent-soft)', display:'flex', alignItems:'center', justifyContent:'center'}}><Icon.Spark size={16} c="var(--accent)"/></div>
                <div style={{flex:1, color:'var(--ink-3)', fontSize:14}}>Ask anything about your health…</div>
                <Icon.Mic size={18} c="var(--ink-3)"/>
              </button>
              <div style={{display:'flex', gap:8, marginTop:12, flexWrap:'wrap'}}>
                {chipTopics.map(t => (
                  <button key={t.slug} onClick={()=>onAsk('Best supplements for ' + t.name.toLowerCase() + '?')} className="bal-pill light" style={{padding:'7px 12px', fontSize:12, border:'none'}}>{t.name}</button>
                ))}
              </div>
            </div>

            <div style={{padding:'14px 18px 0'}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:10}}>
                <div className="serif" style={{fontSize:22, color:'var(--ink)'}}>{hasGoals ? 'Your goals' : 'Popular guides'}</div>
                <button onClick={()=>onNav('intake')} style={{fontSize:12, color:'var(--brand)', fontWeight:600, background:'none', border:'none'}}>{hasGoals ? 'Edit' : 'Personalize'}</button>
              </div>
              <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10}}>
                {gridTopics.map(t => { const Ic = Icon[t.icon]; return (
                  <button key={t.slug} onClick={()=>onOpenCategory(t.slug)} className="bal-card" style={{border:'none', padding:14, aspectRatio:'1', display:'flex', flexDirection:'column', justifyContent:'space-between', textAlign:'left'}}>
                    <div style={{width:32, height:32, borderRadius:10, background:'var(--brand-soft)', display:'flex', alignItems:'center', justifyContent:'center'}}>{Ic && <Ic size={18} c="var(--brand)"/>}</div>
                    <div style={{fontSize:13, fontWeight:600, color:'var(--ink)'}}>{t.name}</div>
                  </button>
                ); })}
              </div>
            </div>

            <div style={{padding:'14px 18px 0'}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:10}}>
                <div className="serif" style={{fontSize:22, color:'var(--ink)'}}>Today's stack</div>
                {stack.length>0 && <div style={{fontSize:12, color:'var(--accent)', fontWeight:500}}>{doneCount} of {stack.length} done</div>}
              </div>
              {stack.length===0 ? (
                <button onClick={()=>onNav('browse')} className="bal-card" style={{width:'100%', textAlign:'left', border:'none', padding:18, color:'var(--ink-2)', fontSize:14}}>
                  No supplements yet. <span style={{color:'var(--brand)', fontWeight:600}}>Open a guide →</span> to build your stack.
                </button>
              ) : (
                <div className="bal-card" style={{padding:'4px 0'}}>
                  {stack.map((it,i,arr) => { const done = taken.includes(it.name); return (
                    <div key={i} style={{display:'flex', alignItems:'center', padding:'12px 16px', borderBottom:i<arr.length-1?'0.5px solid var(--rule)':'none'}}>
                      <button onClick={()=>onToggleTaken(it.name)} style={{width:22, height:22, borderRadius:'50%', background:done?'var(--brand)':'transparent', border:done?'none':'1.6px solid var(--rule)', display:'flex', alignItems:'center', justifyContent:'center', marginRight:12, padding:0}}>{done && <Icon.Check size={12} c="white"/>}</button>
                      <div style={{flex:1}}>
                        <div style={{fontSize:14, fontWeight:500, color:done?'var(--ink-3)':'var(--ink)', textDecoration:done?'line-through':'none'}}>{it.name}</div>
                        <div style={{fontSize:12, color:'var(--ink-3)', marginTop:1}}>{[it.dose, it.timing].filter(Boolean).join(' · ')}</div>
                      </div>
                      <div className={`ev-badge ${GRADE[it.tier]||'c'}`}>{GRADE_LETTER[it.tier]||'·'}</div>
                    </div>
                  ); })}
                </div>
              )}
            </div>
          </div>
          <Tabbar active="home" onNav={onNav}/>
        </div>
      );
    };

    // ============ Ask (functional chat) ============
    // Turn raw "supplement-guide-memory-focus" mentions into friendly names.
    const prettyGuide = (slug) => (TOPIC_BY_SLUG[slug] && TOPIC_BY_SLUG[slug].name) || slug.replace(/-/g,' ').replace(/\b\w/g, c => c.toUpperCase());
    const cleanText = (t) => (t||'').replace(/supplement-guide-([a-z0-9-]+)/g, (_, s) => prettyGuide(s));

    // Inline formatting: **bold**, *italic*, and `code` — where a backtick tier
    // (`Primary`/`Secondary`/`Promising`) becomes a colored evidence badge.
    const TIER_TONE = { primary:'a', secondary:'b', promising:'c' };
    const inline = (s) => {
      const out = []; let k = 0, last = 0, m;
      const re = /(`[^`]+`|\*\*[^*]+\*\*|\*[^*\n]+\*)/g;
      while ((m = re.exec(s)) !== null) {
        if (m.index > last) out.push(<React.Fragment key={k++}>{s.slice(last, m.index)}</React.Fragment>);
        const tok = m[0];
        if (tok[0] === '`') {
          const inner = tok.slice(1, -1);
          const tone = TIER_TONE[inner.toLowerCase()];
          if (tone) out.push(<span key={k++} className={`ev-badge ${tone}`} style={{width:'auto', height:'auto', padding:'1px 8px', borderRadius:6, fontSize:10, marginLeft:4, verticalAlign:'middle'}}>{inner}</span>);
          else out.push(<code key={k++} className="mono" style={{background:'var(--surface-3)', padding:'1px 5px', borderRadius:5, fontSize:'0.92em'}}>{inner}</code>);
        } else if (tok.startsWith('**')) {
          out.push(<strong key={k++}>{tok.slice(2, -2)}</strong>);
        } else {
          out.push(<em key={k++}>{tok.slice(1, -1)}</em>);
        }
        last = re.lastIndex;
      }
      if (last < s.length) out.push(<React.Fragment key={k++}>{s.slice(last)}</React.Fragment>);
      return out;
    };

    // Block formatting: headings, numbered list (supplement entries), bullets
    // (sub-fields), blockquote (safety note), paragraphs.
    const fmt = (text) => {
      const lines = cleanText(text).split('\n');
      const out = []; let key = 0;
      for (const ln of lines) {
        if (/^#{1,3}\s+/.test(ln)) { out.push(<div key={key++} className="serif" style={{fontSize:17, margin:'16px 0 8px', color:'var(--ink)'}}>{inline(ln.replace(/^#{1,3}\s+/,''))}</div>); continue; }
        if (/^>\s+/.test(ln)) { out.push(<div key={key++} style={{borderLeft:'3px solid var(--accent)', background:'var(--accent-soft)', padding:'10px 12px', borderRadius:'0 10px 10px 0', color:'var(--brand-deep)', fontSize:13, lineHeight:1.5, margin:'12px 0 4px'}}>{inline(ln.replace(/^>\s+/,''))}</div>); continue; }
        const num = ln.match(/^(\d+)\.\s+(.*)$/);
        if (num) { out.push(<div key={key++} style={{display:'flex', gap:10, margin:'12px 0 2px', alignItems:'baseline'}}><span className="serif" style={{color:'var(--brand)', fontSize:15, minWidth:18}}>{num[1]}.</span><span style={{flex:1, fontSize:15}}>{inline(num[2])}</span></div>); continue; }
        if (/^\s*[-*]\s+/.test(ln)) { out.push(<div key={key++} style={{display:'flex', gap:8, margin:'3px 0 3px 28px'}}><span style={{color:'var(--ink-4)', lineHeight:1.5}}>•</span><span style={{flex:1}}>{inline(ln.replace(/^\s*[-*]\s+/,''))}</span></div>); continue; }
        if (ln.trim() === '') { out.push(<div key={key++} style={{height:8}}/>); continue; }
        out.push(<div key={key++} style={{margin:'4px 0'}}>{inline(ln)}</div>);
      }
      return out;
    };

    // ============ In-chat order flow (SIMULATED CartAI) ============
    // A fully self-contained, fake CartAI checkout that runs inside the chat.
    // No network, no real money, no real product — it mimics CartAI's state
    // machine (QUEUED → STARTED → IN_PROGRESS → SUCCEEDED) for a believable
    // demo. (The real /api/checkout integration on the Stack screen is a
    // separate, key-gated path — CartAI's live API is currently down.)
    const CartIcon = ({size=18, c='currentColor'}) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2 3h3l2.3 12.2a1 1 0 001 .8h8.8a1 1 0 001-.8L21 7H6"/></svg>
    );
    const SAMPLE_CART = [
      { name:'Magnesium Glycinate', tier:'Primary',   dose:'300 mg', iherb_url:'https://www.iherb.com/search?kw=magnesium+glycinate' },
      { name:'Creatine Monohydrate', tier:'Secondary', dose:'5 g',     iherb_url:'https://www.iherb.com/search?kw=creatine+monohydrate' },
      { name:'Vitamin D3',           tier:'Secondary', dose:'2000 IU', iherb_url:'https://www.iherb.com/search?kw=vitamin+d3' },
    ];
    const fakePrice = (name) => { let h=0; for (let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0; return 6.99 + (h % 1800)/100; };
    const money = (n) => '$' + n.toFixed(2);
    const ORDER_STEPS = [
      { s:'QUEUED',      label:'Order received — queued' },
      { s:'STARTED',     label:'CartAI agent starting' },
      { s:'IN_PROGRESS', label:'Navigating to iHerb' },
      { s:'IN_PROGRESS', label:'Adding items to cart' },
      { s:'IN_PROGRESS', label:'Entering shipping & payment' },
      { s:'IN_PROGRESS', label:'Placing your order' },
      { s:'SUCCEEDED',   label:'Order confirmed' },
    ];

    // Defined at module scope (NOT inside OrderFlow) so its identity is stable
    // across re-renders — otherwise React remounts the form on every keystroke
    // and the focused input loses focus.
    const OrderCard = ({ children }) => (
      <div className="bal-card" style={{marginLeft:34, marginTop:4, padding:0, overflow:'hidden', border:'1px solid var(--rule)'}}>
        <div style={{padding:'10px 14px', background:'var(--brand-soft)', display:'flex', alignItems:'center', justifyContent:'space-between'}}>
          <div style={{display:'flex', alignItems:'center', gap:8}}><CartIcon size={15} c="var(--brand)"/><span style={{fontSize:12, fontWeight:600, color:'var(--brand-deep)'}}>CartAI checkout</span></div>
          <span className="mono" style={{fontSize:9, letterSpacing:'.1em', color:'var(--brand)', background:'white', padding:'2px 7px', borderRadius:5}}>TEST MODE</span>
        </div>
        <div style={{padding:'14px'}}>{children}</div>
      </div>
    );

    const OrderFlow = ({ items, answer }) => {
      const { Icon } = window;
      const fullCart = (items && items.length) ? items : SAMPLE_CART;
      const usingSample = !(items && items.length);
      const [stage, setStage] = useState('cart');          // cart | details | processing | done
      const [addr, setAddr] = useState(() => ({ ...blankAddress(), ...LS.get('bal_addr', {}) }));
      const [stepIdx, setStepIdx] = useState(0);
      const [order, setOrder] = useState(null);
      // Double-check: every line item starts approved; the user can untick any
      // before checkout so the order matches exactly what they want to buy.
      const [confirmed, setConfirmed] = useState(() => new Set(fullCart.map((_,i)=>i)));
      const toggleItem = (i) => setConfirmed(prev => { const n = new Set(prev); n.has(i) ? n.delete(i) : n.add(i); return n; });
      const cart = useMemo(() => fullCart.filter((_,i)=>confirmed.has(i)), [fullCart, confirmed]);

      useEffect(() => { LS.set('bal_addr', addr); }, [addr]);
      const set = (k,v) => setAddr(a => ({ ...a, [k]: v }));
      const subtotal = useMemo(() => cart.reduce((a,it)=>a+fakePrice(it.name),0), [cart]);
      const shipping = 4.99;
      const total = subtotal + shipping;
      const detailsValid = ['firstName','lastName','addressLine1','city','postalCode'].every(k => (addr[k]||'').trim());

      // Drive the simulated CartAI state machine.
      useEffect(() => {
        if (stage !== 'processing') return;
        let i = 0; setStepIdx(0);
        let timer = setTimeout(function tick(){
          i += 1;
          if (i < ORDER_STEPS.length) { setStepIdx(i); timer = setTimeout(tick, 1150); }
          else {
            setOrder({
              num: 'BAL-' + Math.random().toString(36).slice(2,7).toUpperCase(),
              eta: new Date(Date.now()+4*864e5).toLocaleDateString(undefined,{month:'short', day:'numeric'}),
              total, items: cart.length,
            });
            setStage('done');
          }
        }, 1150);
        return () => clearTimeout(timer);
      }, [stage]);

      if (stage === 'cart') return (
        <OrderCard>
          {usingSample && <div style={{fontSize:12, color:'var(--ink-3)', marginBottom:10}}>Your stack was empty, so here's a sample cart you can order.</div>}
          <div style={{fontSize:12, color:'var(--ink-3)', marginBottom:8}}>{answer ? `Double-check the ${fullCart.length} supplement${fullCart.length>1?'s':''} from the answer before ordering — untick anything you don't want.` : 'Double-check your order — untick anything you don’t want before checkout.'}</div>
          {fullCart.map((it,i) => { const on = confirmed.has(i); return (
            <div key={i} style={{display:'flex', alignItems:'center', gap:10, padding:'8px 0', borderBottom:i<fullCart.length-1?'0.5px solid var(--rule)':'none', opacity:on?1:0.45}}>
              <button onClick={()=>toggleItem(i)} aria-pressed={on} aria-label={(on?'Remove ':'Include ')+it.name} style={{width:24, height:24, borderRadius:7, flexShrink:0, border:on?'none':'1.6px solid var(--rule)', background:on?'var(--green-deep)':'transparent', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', padding:0}}>{on && <Icon.Check size={13} c="white"/>}</button>
              <div className={`ev-badge ${GRADE[it.tier]||'c'}`}>{GRADE_LETTER[it.tier]||'·'}</div>
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontSize:14, fontWeight:600, color:'var(--ink)', textDecoration:on?'none':'line-through'}}>{it.name}</div>
                <div style={{fontSize:12, color:'var(--ink-3)'}}>{it.dose || ''}</div>
              </div>
              <div className="mono" style={{fontSize:13, color:on?'var(--ink-2)':'var(--ink-4)'}}>{money(fakePrice(it.name))}</div>
            </div>
          ); })}
          <div style={{marginTop:10, fontSize:13, color:'var(--ink-2)'}}>
            <div style={{display:'flex', justifyContent:'space-between', padding:'2px 0'}}><span>Subtotal · {cart.length} item{cart.length===1?'':'s'}</span><span className="mono">{money(subtotal)}</span></div>
            <div style={{display:'flex', justifyContent:'space-between', padding:'2px 0'}}><span>Shipping</span><span className="mono">{money(shipping)}</span></div>
            <div style={{display:'flex', justifyContent:'space-between', padding:'6px 0 0', fontWeight:700, color:'var(--ink)'}}><span>Total</span><span className="mono">{money(total)}</span></div>
          </div>
          <button disabled={cart.length===0} onClick={()=>setStage('details')} style={{width:'100%', marginTop:14, padding:'12px', borderRadius:12, border:'none', background:cart.length?'var(--brand)':'var(--surface-3)', color:cart.length?'white':'var(--ink-4)', fontSize:14, fontWeight:600, cursor:cart.length?'pointer':'default'}}>{cart.length ? `Continue to checkout · ${cart.length} item${cart.length>1?'s':''}` : 'Select at least one supplement'}</button>
        </OrderCard>
      );

      if (stage === 'details') {
        const f = (label,key,props={}) => (
          <div style={{marginBottom:8}}>
            <div style={{fontSize:10, color:'var(--ink-3)', fontWeight:600, letterSpacing:'.05em', textTransform:'uppercase', marginBottom:3}}>{label}</div>
            <input value={addr[key]||''} onChange={e=>set(key,e.target.value)} {...props} style={{width:'100%', padding:'9px 11px', border:'1px solid var(--rule)', borderRadius:9, fontSize:14, fontFamily:'inherit', outline:'none'}}/>
          </div>
        );
        return (
          <OrderCard>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
              <div>{f('First name','firstName')}</div><div>{f('Last name','lastName')}</div>
            </div>
            {f('Address','addressLine1')}
            <div style={{display:'grid', gridTemplateColumns:'2fr 1fr 1fr', gap:8}}>
              <div>{f('City','city')}</div>
              <div>
                <div style={{fontSize:10, color:'var(--ink-3)', fontWeight:600, letterSpacing:'.05em', textTransform:'uppercase', marginBottom:3}}>State</div>
                <select value={addr.province} onChange={e=>set('province', e.target.value)} style={{width:'100%', padding:'9px 7px', border:'1px solid var(--rule)', borderRadius:9, fontSize:14, fontFamily:'inherit', background:'white'}}>{US_STATES.map(s=><option key={s} value={s}>{s}</option>)}</select>
              </div>
              <div>{f('ZIP','postalCode',{inputMode:'numeric'})}</div>
            </div>
            <div style={{marginTop:8, padding:'10px 12px', background:'var(--surface-2)', borderRadius:10}}>
              <div style={{fontSize:10, letterSpacing:'.08em', textTransform:'uppercase', color:'var(--brand)', fontWeight:600}}>Payment · sandbox card</div>
              <div className="mono" style={{fontSize:13, color:'var(--ink-2)', marginTop:3}}>4242 4242 4242 4242 · 12/34 · 444</div>
            </div>
            <button disabled={!detailsValid} onClick={()=>setStage('processing')} style={{width:'100%', marginTop:12, padding:'12px', borderRadius:12, border:'none', background:detailsValid?'var(--accent)':'var(--surface-3)', color:detailsValid?'white':'var(--ink-4)', fontSize:14, fontWeight:600}}>Place order · {money(total)}</button>
          </OrderCard>
        );
      }

      if (stage === 'processing') return (
        <OrderCard>
          {ORDER_STEPS.map((st,i) => {
            const done = i < stepIdx, active = i === stepIdx;
            if (i > stepIdx) return null;
            return (
              <div key={i} style={{display:'flex', alignItems:'center', gap:10, padding:'7px 0', opacity: done?0.65:1}}>
                <div style={{width:22, height:22, borderRadius:'50%', background:done?'var(--brand)':'var(--brand-soft)', display:'flex', alignItems:'center', justifyContent:'center'}}>
                  {done ? <Icon.Check size={12} c="white"/> : <div className="typing" style={{transform:'scale(0.7)'}}><span></span><span></span><span></span></div>}
                </div>
                <div style={{fontSize:14, color:done?'var(--ink-3)':'var(--ink)', fontWeight:active?600:400}}>{st.label}</div>
                <div className="mono" style={{marginLeft:'auto', fontSize:9, color:'var(--ink-4)'}}>{st.s}</div>
              </div>
            );
          })}
        </OrderCard>
      );

      // done
      return (
        <OrderCard>
          <div style={{textAlign:'center', padding:'4px 0 10px'}}>
            <div style={{width:48, height:48, borderRadius:'50%', background:'var(--brand)', display:'inline-flex', alignItems:'center', justifyContent:'center', marginBottom:10}}><Icon.Check size={24} c="white"/></div>
            <div className="serif" style={{fontSize:22, color:'var(--ink)'}}>Order placed</div>
            <div style={{fontSize:13, color:'var(--ink-3)', marginTop:2}}>Confirmation <span className="mono" style={{color:'var(--brand)'}}>{order.num}</span></div>
          </div>
          <div style={{borderTop:'0.5px solid var(--rule)', paddingTop:10, fontSize:13, color:'var(--ink-2)'}}>
            <div style={{display:'flex', justifyContent:'space-between', padding:'2px 0'}}><span>{order.items} item{order.items>1?'s':''}</span><span className="mono">{money(order.total)}</span></div>
            <div style={{display:'flex', justifyContent:'space-between', padding:'2px 0'}}><span>Est. delivery</span><span>{order.eta}</span></div>
          </div>
          <div style={{marginTop:12, fontSize:11, color:'var(--ink-3)', lineHeight:1.5, textAlign:'center'}}>Simulated CartAI order — no real money or product. Swap in your live CartAI key to make it real.</div>
        </OrderCard>
      );
    };

    // ============ Substance support (curated, prototype) ============
    // Curated substance -> nutritional-support lists. IMPORTANT: this is a
    // human-curated dataset shown as-is (the assistant never generates these),
    // labelled a prototype and pending clinician/pharmacist review before any
    // real-world use. Content is educational, not medical advice or treatment.

    const _wbTest = (alias, t) => {

      catch (e) { return t.includes(alias); }

    // Levenshtein distance (bounded) for typo tolerance ("alchohol"→"alcohol").
    const _lev = (a, b) => {
      if (Math.abs(a.length - b.length) > 2) return 99;
      let prev = Array.from({length:b.length+1}, (_,i) => i);
      for (let i=1;i<=a.length;i++) {
        const cur = [i];
        for (let j=1;j<=b.length;j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
        prev = cur;
      }
      return prev[b.length];
    };
    // Fuzzy-match single-word aliases of length ≥6 (skip short ones / phrases to
    // avoid false positives). tol 1 normally, 2 for long medical names.
    const _fuzzyHit = (alias, tokens) => {

      return tokens.some(tok => Math.abs(tok.length - alias.length) <= 2 && _lev(tok, alias) <= tol);

            {supps.map((s,i) => { const on = sel.has(s.id); return (
              <div key={s.id} style={{display:'flex', alignItems:'center', gap:10, padding:'10px 14px', borderBottom:i<supps.length-1?'0.5px solid var(--rule)':'none'}}>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{fontSize:14, fontWeight:600, color:'var(--ink)'}}>{s.n}</div>
                  <div style={{display:'flex', flexWrap:'wrap', gap:6, marginTop:3}}>
                    {buyLinksFor(s).map(r => (
                      <a key={r.key} href={r.url} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex', alignItems:'center', gap:3, fontSize:11, color:'var(--brand)', fontWeight:500, textDecoration:'none'}}>{r.name} <ExternalIcon size={9} c="var(--brand)"/></a>
                    ))}
                  </div>
                </div>
                <button onClick={()=>toggle(s.id)} aria-pressed={on} aria-label={(on?'Remove ':'Add ')+s.n} style={{width:32, height:32, borderRadius:'50%', border:'none', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', background:on?'var(--green-deep)':'var(--brand-soft)', cursor:'pointer', transition:'background 150ms'}}>
                  {on ? <Icon.Check size={15} c="white"/> : <Icon.Plus size={16} c="var(--brand)"/>}
                </button>
              </div>
            ); })}
          </div>
          <button disabled={count===0} onClick={order} style={{width:'100%', marginTop:10, padding:'13px', borderRadius:14, border:'none', fontSize:15, fontWeight:600, display:'flex', alignItems:'center', justifyContent:'center', gap:8, background:count?'var(--green-deep)':'var(--surface-3)', color:count?'white':'var(--ink-4)', boxShadow:count?'0 6px 16px rgba(19,160,92,0.28)':'none', cursor:count?'pointer':'default', transition:'background 150ms, box-shadow 150ms'}}>
            <CartIcon size={16} c={count?'white':'var(--ink-4)'}/>
            {count ? `Order ${count} supplement${count>1?'s':''}` : 'Select supplements to order'}
          </button>
        </div>
      );
    };

    const Ask = ({ stack, onAdd, inStack, onNav, initialQuery, mushrooms, interactions }) => {
      const { Icon } = window;
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [busy, setBusy] = useState(false);
      const scrollRef = useRef(null);
      const didInit = useRef(false);
      useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, busy]);

      // Drop the simulated CartAI order card into the conversation. `cart` is the
      // resolved line-items; `itemName` (optional) is the single named supplement.
      const startOrder = (userText, cart, itemName) => {
        const resolved = (cart && cart.length) ? cart : (stack.length ? stack : SAMPLE_CART);
        setMessages(m => [
          ...m,
          ...(userText ? [{ role:'user', content:userText }] : []),
          { role:'assistant', content: itemName ? `On it — ordering ${itemName} via CartAI. 🛒` : "Let's get your stack ordered via CartAI. 🛒" },
          { role:'assistant', kind:'order', cart: resolved },
        ]);
      };

      // Order a specific set of selected supplements from an answer's order list.
      // `answer` is carried through so the order card can show the double-check.
      const orderItems = (items, answer) => {
        if (!items || !items.length) return;
        setMessages(m => [
          ...m,
          { role:'assistant', content: `Review your order below — confirm the supplement${items.length>1?'s':''} you want, then check out. 🛒` },
          { role:'assistant', kind:'order', cart: items, answer },
        ]);
      };

      const send = async (q) => {
        const question = (q ?? input).trim();
        if (!question || busy) return;
        setInput('');
        // Purchase intent → run the in-chat (simulated) CartAI checkout, not the LLM.
        const intent = parseOrderIntent(question);
        if (intent) {
          if (intent.whole) { startOrder(question, null, null); return; }
          const name = titleCase(intent.item);
          const cart = [{ name, tier:'Secondary', dose:'', iherb_url:'https://www.iherb.com/search?kw=' + encodeURIComponent(intent.item) }];
          startOrder(question, cart, name);
          return;
        }
        // Dangerous-combination question → curated warning card (highest priority,
        // so "alcohol + heroin" warns rather than showing a support card).
        const inter = detectInteractions(question, interactions && interactions.rules);
        if (inter.length) {
          setMessages(m => [...m, { role:'user', content:question }, { role:'assistant', kind:'interaction', rules:inter }]);
          return;
        }
        // Substance-support intent → show the curated, vetted card instead of
        // letting the assistant generate drug/supplement advice.
        const sub = detectSubstance(question);
        if (sub) {
          setMessages(m => [...m, { role:'user', content:question }, { role:'assistant', kind:'substance', sub }]);
          return;
        }
        // (b) Direct "benefits of <mushroom>" → curated ranked card. Nuanced
        // mushroom questions fall through to the agent, which also has the DB (a).
        const mush = detectMushroom(question, mushrooms);
        if (mush) {
          setMessages(m => [...m, { role:'user', content:question }, { role:'assistant', kind:'mushroom', mush }]);
          return;
        }
        const next = [...messages, { role:'user', content:question }];
        setMessages(next);
        setBusy(true);
        const payload = { messages: next.map(m => ({ role:m.role, content:m.content })), stack: stack.map(s => s.name) };
        try {
          const res = await fetch('/api/chat/stream', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
          if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
          const reader = res.body.getReader();
          const dec = new TextDecoder();
          let buf = '', acc = '', sources = [];
          setMessages(m => [...m, { role:'assistant', content:'' }]);
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream:true });
            const events = buf.split('\n\n'); buf = events.pop();
            for (const ev of events) {
              const line = ev.split('\n').find(l => l.startsWith('data:'));
              if (!line) continue;
              try {
                const j = JSON.parse(line.slice(5).trim());
                if (j.text) { acc += j.text; setMessages(m => { const c=[...m]; c[c.length-1]={role:'assistant', content:acc, sources}; return c; }); }
                if (j.sources) { sources = j.sources; setMessages(m => { const c=[...m]; c[c.length-1]={role:'assistant', content:acc, sources}; return c; }); }
              } catch {}
            }
          }
        } catch (err) {
          setMessages(m => [...m, { role:'assistant', content:'⚠️ The assistant is temporarily unavailable — please try again in a moment.' }]);
        } finally { setBusy(false); }
      };

      // A quick-search chip from Home seeds an initial question — auto-run it once.
      useEffect(() => { if (!didInit.current && initialQuery) { didInit.current = true; send(initialQuery); } }, []);

      const suggestions = ['Best for sleep?','Afternoon energy','Stress relief','Muscle recovery','Recovery & detox'];
      return (
        <div className="screen-root">
          <div ref={scrollRef} className="scroll" style={{height:'100%', paddingBottom:96}}>
            <div style={{height:54}}/>
            <div style={{padding:'8px 18px', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
              <button onClick={()=>onNav('home')} style={{width:36, height:36, borderRadius:'50%', background:'var(--surface)', boxShadow:'var(--sh-1)', display:'flex', alignItems:'center', justifyContent:'center', border:'none'}}><Icon.Back size={16} c="var(--ink-2)"/></button>
              <div style={{fontSize:13, color:'var(--ink-3)', fontWeight:500}}>Ask Balance</div>
              <div style={{display:'flex', gap:8}}>
                <button onClick={()=>startOrder('Order my stack', null, null)} title="Order your stack (test)" style={{width:36, height:36, borderRadius:'50%', background:'var(--brand)', display:'flex', alignItems:'center', justifyContent:'center', border:'none'}}><CartIcon size={16} c="white"/></button>
                <button onClick={()=>setMessages([])} style={{width:36, height:36, borderRadius:'50%', background:'var(--surface)', boxShadow:'var(--sh-1)', display:'flex', alignItems:'center', justifyContent:'center', border:'none'}}><Icon.Plus size={16} c="var(--ink-2)"/></button>
              </div>
            </div>

            {messages.length===0 && (
              <div style={{padding:'24px 22px'}}>
                <div style={{display:'flex', justifyContent:'center', marginBottom:18}}><window.BalLogoMark size={56}/></div>
                <div className="serif" style={{fontSize:26, textAlign:'center', color:'var(--ink)', lineHeight:1.15}}>What do you need<br/><em style={{color:'var(--brand)'}}>supplements for?</em></div>
                <div style={{fontSize:13, color:'var(--ink-3)', textAlign:'center', marginTop:10, lineHeight:1.5, maxWidth:'90%', marginLeft:'auto', marginRight:'auto'}}>I search 19 evidence-based guides and return ranked supplements with dose, timing, and grade.</div>
                <div style={{display:'flex', flexWrap:'wrap', gap:8, marginTop:20, justifyContent:'center'}}>
                  {suggestions.map(s => <button key={s} onClick={()=>send(s)} className="bal-pill" style={{border:'none', padding:'9px 14px', fontSize:13, cursor:'pointer'}}>{s}</button>)}
                </div>
                <button onClick={()=>startOrder('Order my stack', null, null)} className="bal-card" style={{border:'none', width:'100%', textAlign:'left', padding:'13px 15px', fontSize:14, color:'var(--brand-deep)', background:'var(--brand-soft)', display:'flex', alignItems:'center', gap:10, fontWeight:600, marginTop:14}}><CartIcon size={16} c="var(--brand)"/> Order my stack</button>
              </div>
            )}

            {messages.map((m,i) => m.role==='user' ? (
              <div key={i} style={{padding:'14px 18px 0', display:'flex', justifyContent:'flex-end'}}>
                <div style={{maxWidth:'82%', background:'var(--brand)', color:'white', padding:'11px 15px', borderRadius:'20px 20px 4px 20px', fontSize:14, lineHeight:1.4}}>{m.content}</div>
              </div>
            ) : m.kind==='order' ? (
              <div key={i} style={{padding:'10px 18px 0'}}><OrderFlow items={m.cart} answer={m.answer}/></div>
            ) : m.kind==='substance' ? (
              <div key={i} style={{padding:'16px 18px 0'}}>
                <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:8}}>
                  <window.BalLogoMark size={26}/>
                  <div style={{fontSize:12, fontWeight:600, color:'var(--ink-2)'}}>Balance</div>
                  <div style={{fontSize:11, color:'var(--ink-4)'}}>· {GROUP_LABEL[m.sub.group]}</div>
                </div>
                <div style={{marginLeft:34}}>
                  <div className="bal-card" style={{padding:'14px 16px'}}>
                    <div style={{fontSize:16, fontWeight:600, color:'var(--ink)', marginBottom:10}}>Support for {m.sub.name}</div>
                    <SubstancePanel sub={m.sub} onAdd={onAdd} inStack={inStack}/>
                  </div>
                </div>
              </div>
            ) : m.kind==='interaction' ? (
              <div key={i} style={{padding:'16px 18px 0'}}>
                <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:8}}>
                  <window.BalLogoMark size={26}/>
                  <div style={{fontSize:12, fontWeight:600, color:'var(--ink-2)'}}>Balance</div>
                  <div style={{fontSize:11, color:'var(--ink-4)'}}>· combination safety</div>
                </div>
                <div style={{marginLeft:34}}>
                  <div className="bal-card" style={{padding:'14px 16px'}}>
                    <div style={{fontSize:16, fontWeight:600, color:'var(--ink)', marginBottom:10}}>Combination safety</div>
                    <InteractionCard rules={m.rules} meta={interactions}/>
                  </div>
                </div>
              </div>
            ) : m.kind==='mushroom' ? (
              <div key={i} style={{padding:'16px 18px 0'}}>
                <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:8}}>
                  <window.BalLogoMark size={26}/>
                  <div style={{fontSize:12, fontWeight:600, color:'var(--ink-2)'}}>Balance</div>
                  <div style={{fontSize:11, color:'var(--ink-4)'}}>· evidence database</div>
                </div>
                <div style={{marginLeft:34}}>
                  <div className="bal-card" style={{padding:'14px 16px'}}>
                    <MushroomCard mush={m.mush}/>
                  </div>
                </div>
              </div>
            ) : (() => {
              // Extras (the build-your-order supplement list, sources, follow-ups)
              // appear once the answer is complete — not while it's streaming.
              const complete = m.content && !(busy && i === messages.length-1);
              const supps = complete ? detectSupps(m.content) : [];
              const prevUser = complete ? [...messages.slice(0,i)].reverse().find(x => x.role==='user') : null;
              const followups = complete ? generateFollowups(prevUser ? prevUser.content : '') : [];
              return (
              <div key={i} style={{padding:'16px 18px 0'}}>
                <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:8}}>
                  <window.BalLogoMark size={26}/>
                  <div style={{fontSize:12, fontWeight:600, color:'var(--ink-2)'}}>Balance</div>
                  {m.sources && m.sources.length>0 && <div style={{fontSize:11, color:'var(--ink-4)'}}>· searched {m.sources.length} guide{m.sources.length>1?'s':''}</div>}
                </div>
                <div style={{fontSize:14.5, color:'var(--ink-2)', lineHeight:1.55, marginLeft:34}}>
                  {m.content ? fmt(m.content) : <div className="typing"><span></span><span></span><span></span></div>}
                </div>

                {supps.length>0 && <AnswerSupps supps={supps} answer={m.content} onOrder={orderItems}/>}

                {m.sources && m.sources.length>0 && complete && (
                  <div style={{marginLeft:34, marginTop:12, display:'flex', flexWrap:'wrap', gap:6}}>
                    {m.sources.map(s => <span key={s} style={{fontSize:10, padding:'3px 8px', borderRadius:999, background:'var(--brand-soft)', color:'var(--brand-deep)', fontWeight:500}}>{s.replace(/^supplement-guide-/,'')}</span>)}
                  </div>
                )}

                {followups.length>0 && (
                  <div style={{marginLeft:34, marginTop:12, display:'flex', flexWrap:'wrap', gap:8}}>
                    {followups.map(q => <button key={q} onClick={()=>send(q)} style={{padding:'8px 14px', background:'var(--surface)', border:'0.5px solid var(--rule)', borderRadius:999, fontSize:13, color:'var(--brand-deep)', fontWeight:500, cursor:'pointer'}}>{q}</button>)}
                  </div>
                )}
              </div>
              );
            })())}
          </div>

          <div style={{position:'absolute', left:0, right:0, bottom:0, padding:'12px 16px 26px', background:'linear-gradient(to top, var(--bg) 70%, transparent)'}}>
            <div style={{display:'flex', alignItems:'center', gap:8, background:'var(--surface)', borderRadius:24, boxShadow:'var(--sh-2)', padding:'6px 6px 6px 16px'}}>
              <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') send(); }} placeholder="Ask a follow-up…" style={{flex:1, border:'none', outline:'none', fontSize:15, fontFamily:'inherit', background:'transparent', color:'var(--ink)'}}/>
              <button onClick={()=>send()} disabled={busy||!input.trim()} style={{width:38, height:38, borderRadius:'50%', background:(busy||!input.trim())?'var(--surface-3)':'var(--brand)', display:'flex', alignItems:'center', justifyContent:'center', border:'none'}}>
                <Icon.Send size={16} c={(busy||!input.trim())?'var(--ink-4)':'white'}/>
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ============ Learn ============
    const Learn = ({ onOpen, onOpenSupplement, onOpenSubstance, onNav }) => {
      const { Icon, Tabbar } = window;
      const [mode, setMode] = useState('topics');   // 'topics' | 'supplements' | 'substances'
      const [q, setQ] = useState('');
      const query = q.trim().toLowerCase();
      // Results update live as you type (instant client-side filter).
      const topics = TOPICS.filter(t => !query || t.name.toLowerCase().includes(query) || t.slug.replace(/-/g,' ').includes(query));
      const supps = SUPPLEMENTS.filter(s => !query || s.n.toLowerCase().includes(query) || s.t.some(slug => (TOPIC_BY_SLUG[slug]?.name||'').toLowerCase().includes(query)));
      const subs = SUBSTANCE_SUPPORT.filter(s => !query || s.name.toLowerCase().includes(query) || GROUP_LABEL[s.group].toLowerCase().includes(query) || s.aliases.some(a => a.includes(query)));
      const seg = (k, label, count) => (
        <button onClick={()=>setMode(k)} style={{flex:1, padding:'9px 0', borderRadius:9, border:'none', cursor:'pointer', background: mode===k?'white':'transparent', color: mode===k?'var(--brand)':'var(--ink-3)', fontWeight:600, fontSize:13, boxShadow: mode===k?'var(--sh-1)':'none', transition:'background 150ms'}}>{label} <span style={{opacity:.55}}>{count}</span></button>
      );
      const empty = (
        <div style={{textAlign:'center', padding:'48px 20px', color:'var(--ink-3)'}}>
          <div style={{fontSize:15, fontWeight:600, color:'var(--ink-2)'}}>No matches</div>
          <div style={{fontSize:13, marginTop:4}}>Nothing here for “{q}”. Try another term.</div>
        </div>
      );
      return (
        <div className="screen-root">
          <div className="scroll" style={{height:'100%', paddingBottom:130}}>
            <div style={{height:54}}/>
            <div style={{padding:'8px 22px'}}>
              <div className="serif" style={{fontSize:34, lineHeight:1, color:'var(--ink)'}}>Learn</div>
              <div style={{fontSize:13, color:'var(--ink-3)', marginTop:4}}>{TOPICS.length} categories · {SUPPLEMENTS.length} supplements</div>
            </div>
            {/* Live search */}
            <div style={{padding:'14px 18px 0'}}>
              <div style={{background:'var(--surface)', borderRadius:14, padding:'10px 14px', display:'flex', alignItems:'center', gap:10, boxShadow:'var(--sh-1)'}}>
                <Icon.Search size={16} c="var(--ink-3)"/>
                <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search categories or supplements" style={{flex:1, border:'none', outline:'none', background:'transparent', fontSize:14, fontFamily:'inherit', color:'var(--ink)'}}/>
                {q && <button onClick={()=>setQ('')} aria-label="Clear search" style={{border:'none', background:'var(--surface-3)', width:20, height:20, borderRadius:'50%', color:'var(--ink-3)', fontSize:14, lineHeight:1, cursor:'pointer', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center'}}>×</button>}
              </div>
            </div>
            {/* Selection toggle: categories vs supplements */}
            <div style={{padding:'12px 18px 0'}}>
              <div style={{display:'flex', background:'var(--surface-3)', borderRadius:12, padding:3}}>
                {seg('topics','Categories', topics.length)}
                {seg('supplements','Supplements', supps.length)}
                {seg('substances','Substances', subs.length)}
              </div>
            </div>
            {/* Featured guide — only on Categories with no active search */}
            {mode==='topics' && !query && (
              <div style={{padding:'16px 18px 0'}}>
                <button onClick={()=>onOpen('memory-focus')} className="bal-card" style={{width:'100%', textAlign:'left', border:'none', padding:0, overflow:'hidden', position:'relative'}}>
                  <div style={{padding:'18px 18px 16px', background:'linear-gradient(140deg, var(--brand-soft) 0%, #d6cffa 100%)', position:'relative', minHeight:140}}>
                    <div style={{fontSize:11, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--brand-deep)', fontWeight:600}}>Featured guide</div>
                    <div className="serif" style={{fontSize:28, lineHeight:1.18, marginTop:10, color:'var(--ink)', maxWidth:'68%'}}>Memory &amp; Focus, <em>backed by studies</em></div>
                    <div style={{fontSize:13, color:'var(--brand-deep)', marginTop:16}}>AI-built stack · buy links · 1-tap</div>
                    <div style={{position:'absolute', right:24, bottom:18}}><Icon.Brain size={44} c="var(--brand)"/></div>
                  </div>
                </button>
              </div>
            )}
            {/* Results */}
            <div style={{padding:'18px 18px 0'}}>
              {mode==='topics' ? (
                topics.length ? (
                  <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10}}>
                    {topics.map(t => { const Ic = Icon[t.icon]; return (
                      <button key={t.slug} onClick={()=>onOpen(t.slug)} className="bal-card" style={{border:'none', textAlign:'left', padding:14, aspectRatio:'1', display:'flex', flexDirection:'column', justifyContent:'space-between'}}>
                        <div style={{width:32, height:32, borderRadius:10, background:'var(--brand-soft)', display:'flex', alignItems:'center', justifyContent:'center'}}>{Ic && <Ic size={18} c="var(--brand)"/>}</div>
                        <div><div style={{fontSize:14, fontWeight:600, color:'var(--ink)'}}>{t.name}</div><div style={{fontSize:11, color:'var(--ink-3)', marginTop:2}}>Grade {t.grade}</div></div>
                      </button>
                    ); })}
                  </div>
                ) : empty
              ) : mode==='supplements' ? (
                supps.length ? (
                  <div className="bal-card" style={{padding:'2px 0'}}>
                    {supps.map((s,i) => (
                      <button key={s.n} onClick={()=>onOpenSupplement(s.n)} style={{width:'100%', textAlign:'left', display:'flex', alignItems:'center', gap:12, padding:'12px 16px', borderBottom:i<supps.length-1?'0.5px solid var(--rule)':'none', background:'none', border:'none', cursor:'pointer'}}>
                        <div style={{width:32, height:32, borderRadius:10, background:'var(--brand-soft)', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', color:'var(--brand)', fontWeight:700, fontSize:14}}>{s.n[0]}</div>
                        <div style={{flex:1, minWidth:0}}>
                          <div style={{fontSize:14, fontWeight:600, color:'var(--ink)'}}>{s.n}</div>
                          <div style={{fontSize:11, color:'var(--ink-3)', marginTop:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{s.t.map(slug => (TOPIC_BY_SLUG[slug]?.name)||slug).join(' · ')}</div>
                        </div>
                        <Icon.Chevron size={13} c="var(--ink-4)"/>
                      </button>
                    ))}
                  </div>
                ) : empty
              ) : (
                subs.length ? (
                  <div>
                    <div style={{fontSize:11.5, color:'var(--ink-3)', lineHeight:1.5, padding:'11px 13px', background:'var(--surface-3)', borderRadius:12, marginBottom:14}}>Nutritional-support ideas for substances & medications — <b>educational prototype, not medical advice</b>. Always check with a doctor or pharmacist, especially with prescription drugs.</div>
                    {SUBSTANCE_GROUPS.map(g => { const items = subs.filter(s => s.group===g.key); if (!items.length) return null; return (
                      <div key={g.key} style={{marginBottom:18}}>
                        <div style={{fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--ink-3)', fontWeight:600, marginBottom:8}}>{g.label}</div>
                        <div className="bal-card" style={{padding:'2px 0'}}>
                          {items.map((s,i) => (
                            <button key={s.key} onClick={()=>onOpenSubstance(s.key)} style={{width:'100%', textAlign:'left', display:'flex', alignItems:'center', gap:12, padding:'12px 16px', borderBottom:i<items.length-1?'0.5px solid var(--rule)':'none', background:'none', border:'none', cursor:'pointer'}}>
                              <div style={{width:32, height:32, borderRadius:10, background:'var(--brand-soft)', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', color:'var(--brand)', fontWeight:700, fontSize:14}}>{s.name[0]}</div>
                              <div style={{flex:1, minWidth:0}}>
                                <div style={{fontSize:14, fontWeight:600, color:'var(--ink)'}}>{s.name}</div>
                                <div style={{fontSize:11, color:'var(--ink-3)', marginTop:1}}>{s.supps.length} support supplements</div>
                              </div>
                              <Icon.Chevron size={13} c="var(--ink-4)"/>
                            </button>
                          ))}
                        </div>
                      </div>
                    ); })}
                  </div>
                ) : empty
              )}
            </div>
          </div>
          <Tabbar active="browse" onNav={onNav}/>
        </div>
      );
    };

    // ============ Category ============
    const CategorySkeleton = () => (
      <div style={{padding:'14px 18px'}}>{[0,1,2].map(i => <div key={i} className="cat-skel" style={{height:i===0?88:64, marginBottom:12}}/>)}</div>
    );
    const TIERS = ['Primary','Secondary','Promising'];
    const Category = ({ slug, data, loading, error, inStack, onAdd, onBack, onNav }) => {
      const { Icon, Tabbar } = window;
      const topic = TOPIC_BY_SLUG[slug] || { name:'Guide' };
      const title = data?.title || topic.name;
      const parts = title.split(' '); const head1 = parts[0]; const headRest = parts.slice(1).join(' ');
      const byTier = useMemo(() => { const a={Primary:[],Secondary:[],Promising:[]}; (data?.supplements||[]).forEach(s=>{ if(a[s.tier]) a[s.tier].push(s); }); return a; }, [data]);
      return (
        <div className="screen-root">
          <div className="scroll" style={{height:'100%', paddingBottom:110}}>
            <div style={{background:'linear-gradient(160deg, var(--brand) 0%, var(--brand-deep) 100%)', color:'white', padding:'18px 22px 30px', position:'relative', overflow:'hidden'}}>
              <div style={{position:'absolute', top:-60, right:-40, width:200, height:200, borderRadius:'50%', background:'rgba(243,169,253,0.10)'}}/>
              <div style={{position:'absolute', bottom:-80, left:-40, width:240, height:240, borderRadius:'50%', background:'rgba(86,182,198,0.08)'}}/>
              <div style={{height:54}}/>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', position:'relative', zIndex:1}}>
                <button onClick={onBack} style={{width:36, height:36, borderRadius:'50%', background:'rgba(255,255,255,0.14)', display:'flex', alignItems:'center', justifyContent:'center', border:'none'}}><Icon.Back size={16} c="white"/></button>
                <button onClick={()=>onNav('ask')} style={{width:36, height:36, borderRadius:'50%', background:'rgba(255,255,255,0.14)', display:'flex', alignItems:'center', justifyContent:'center', border:'none'}}><Icon.Spark size={18} c="white"/></button>
              </div>
              <div style={{fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--accent-soft)', marginTop:22, fontWeight:600, position:'relative'}}>Evidence-based guide</div>
              <div className="serif" style={{fontSize:40, lineHeight:1.06, marginTop:8, position:'relative'}}>{head1}{headRest && <> <em style={{fontStyle:'italic', color:'var(--accent-soft)'}}>{headRest}</em></>}</div>
              <div style={{fontSize:14, color:'rgba(255,255,255,0.78)', marginTop:8, maxWidth:'92%', position:'relative'}}>An AI-built stack from the supplement guide — tiered by evidence, with how to take each one and a link to iHerb.</div>
            </div>

            {error && <div style={{margin:'18px 22px', padding:'14px 16px', background:'var(--accent-soft)', color:'var(--brand-deep)', borderRadius:12, fontSize:13}}>Couldn't load this guide: {error}</div>}

            <div style={{padding:'22px 22px 6px'}}>
              <div className="serif" style={{fontSize:22, marginBottom:12, color:'var(--ink)'}}>What hurts <em style={{fontStyle:'italic', color:'var(--brand)'}}>{title.toLowerCase()}</em></div>
              <div className="bal-card" style={{padding:'4px 0'}}>
                {(loading||!data) ? <CategorySkeleton/> : (data.problems||[]).map((p,i,arr) => (
                  <div key={i} style={{display:'flex', gap:14, padding:'16px 18px', borderBottom:i<arr.length-1?'0.5px solid var(--rule)':'none'}}>
                    <div className="mono" style={{width:26, height:26, borderRadius:8, background:'var(--brand-soft)', color:'var(--brand)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:12, fontWeight:600}}>{String(i+1).padStart(2,'0')}</div>
                    <div><div style={{fontSize:15, fontWeight:600, color:'var(--ink)'}}>{p.title}</div><div style={{fontSize:13, color:'var(--ink-2)', marginTop:2, lineHeight:1.45}}>{p.description}</div></div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{padding:'22px 22px 6px'}}>
              <div className="serif" style={{fontSize:22, marginBottom:12, color:'var(--ink)'}}>What you can <em style={{fontStyle:'italic', color:'var(--brand)'}}>do</em></div>
              <div className="bal-card" style={{padding:'4px 0'}}>
                {(loading||!data) ? <CategorySkeleton/> : (data.what_you_can_do||[]).map((l,i,arr) => (
                  <div key={i} style={{display:'flex', gap:14, padding:'16px 18px', borderBottom:i<arr.length-1?'0.5px solid var(--rule)':'none'}}>
                    <div className="mono" style={{width:26, height:26, borderRadius:8, background:'var(--accent-soft)', color:'var(--brand)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:12, fontWeight:600}}>{String(i+1).padStart(2,'0')}</div>
                    <div><div style={{fontSize:15, fontWeight:600, color:'var(--ink)'}}>{l.title}</div><div style={{fontSize:13, color:'var(--ink-2)', marginTop:2, lineHeight:1.45}}>{l.description}</div></div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{padding:'24px 22px 6px'}}>
              <div className="serif" style={{fontSize:22, marginBottom:6, color:'var(--ink)'}}>Recommended <em style={{fontStyle:'italic', color:'var(--brand)'}}>stack</em></div>
              <div style={{fontSize:13, color:'var(--ink-3)', marginBottom:14}}>Tiered by evidence in the guide. Unproven supplements are filtered out.</div>
              {(loading||!data) && <CategorySkeleton/>}
              {data && TIERS.map(t => byTier[t].length>0 && (
                <div key={t} style={{marginBottom:18}}>
                  <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:10}}>
                    <div className={`ev-badge ${GRADE[t]}`}>{GRADE_LETTER[t]}</div>
                    <div className="mono" style={{fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', fontWeight:600, color:'var(--ink-2)'}}>{t} supplements</div>
                  </div>
                  {byTier[t].map((s,i) => { const added = inStack(s.name); return (
                    <div key={i} className="bal-card" style={{padding:'14px 16px', marginBottom:10}}>
                      <div style={{display:'flex', alignItems:'baseline', justifyContent:'space-between', gap:10}}>
                        <div style={{fontSize:16, fontWeight:600, color:'var(--ink)'}}>{s.name}</div>
                        {s.form && <div style={{fontStyle:'italic', color:'var(--ink-3)', fontSize:12}}>{s.form}</div>}
                      </div>
                      <div style={{display:'flex', flexWrap:'wrap', gap:8, marginTop:8}}>
                        <span className="bal-pill light mono" style={{fontSize:11}}>{s.dose}</span>
                        {s.timing && <span className="bal-pill light mono" style={{fontSize:11}}>{s.timing}</span>}
                      </div>
                      {s.evidence && <div style={{fontSize:13, color:'var(--ink-2)', lineHeight:1.45, marginTop:8}}>{s.evidence}</div>}
                      <div style={{display:'flex', gap:8, marginTop:10}}>
                        <button onClick={()=>onAdd(s, title)} disabled={added} style={{display:'inline-flex', alignItems:'center', gap:6, padding:'8px 14px', background:added?'var(--brand-soft)':'var(--brand)', color:added?'var(--brand)':'white', borderRadius:999, border:'none', fontSize:13, fontWeight:600}}>
                          {added ? <>Added <Icon.Check size={12} c="var(--brand)"/></> : <>Add to stack <Icon.Plus size={13} c="white"/></>}
                        </button>
                        {buyLinksForName(s.name, s.iherb_url).map(r => (
                          <a key={r.key} href={r.url} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex', alignItems:'center', gap:6, padding:'8px 14px', background:'var(--surface-3)', color:'var(--ink-2)', borderRadius:999, textDecoration:'none', fontSize:13, fontWeight:600}}>{r.name} <ExternalIcon c="var(--ink-2)"/></a>
                        ))}
                      </div>
                    </div>
                  ); })}
                </div>
              ))}
              <div style={{fontSize:11, color:'var(--ink-3)', textAlign:'center', padding:'18px 8px 24px', lineHeight:1.5}}>Always check with your healthcare provider before starting any new supplement, especially if you take medication or have a health condition.</div>
            </div>
          </div>
          <Tabbar active="browse" onNav={onNav}/>
        </div>
      );
    };

    // ============ Supplement (in-app detail: which guides recommend it) ============
    // A supplement-centric page. Aggregates this supplement's entry across the
    // category guides it appears in (dose / timing / evidence / tier pulled from
    // those guides). Replaces the old behaviour of jumping to a condition guide.
    //
    // The Learn list uses umbrella names ("Blueberries", "CDP-Choline") while the
    // guide data uses specific forms ("Blueberry powder", "CDP-choline
    // (citicoline)"), so we match tolerantly (normalized substring, either way)
    // and — crucially — never dead-end: if nothing matches we still link out to
    // the guides the supplement is tagged to.
    const _suppNorm = (s) => (s||'').toLowerCase().replace(/\([^)]*\)/g,' ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
    const _suppMatches = (a, b) => { const x=_suppNorm(a), y=_suppNorm(b); return !!x && !!y && (x.includes(y) || y.includes(x)); };

    // Curated supplement entries — for supplements not covered by the Examine
    // guides. Evidence is summarised from freely-usable public sources
    // (PubMed / open-access reviews); Examine is a link-out only, not reproduced.
    const CURATED_SUPPLEMENTS = {
      "Lion's Mane": {
        aka: "Hericium erinaceus",
        summary: "A culinary-medicinal mushroom studied for cognition and nerve health. Its compounds (hericenones, erinacines) stimulate nerve growth factor (NGF), with anti-inflammatory and antioxidant effects.",
        dose: "1,050–3,000 mg/day, split into 3–4 doses",
        safety: "Generally well-tolerated (GRAS). Avoid if you're allergic to mushrooms. Long-term human safety data is limited.",
        benefits: [
          { claim: "Attention & working memory (≈8-week use)", strength: "Preliminary" },
          { claim: "Cognition in mild cognitive impairment (16-week)", strength: "Preliminary" },
          { claim: "Mood & sleep quality", strength: "Preliminary" },
          { claim: "Single-dose cognitive boost", strength: "Mixed / weak" },
        ],
        note: "Human trials are small and short; chronic use looks more consistent than single doses. No dedicated Cochrane systematic review exists yet.",
        sources: [
          { name: "PubMed — RCT (younger adults)", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC12018234/" },
          { name: "PubMed — systematic review", url: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12434001/" },
          { name: "PubMed — neuroprotective review", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC12030463/" },
          { name: "Examine — overview", url: "https://examine.com/supplements/lionsmane/" },
        ],
      },
    };
    const STRENGTH_TONE = { "Preliminary":"c", "Mixed / weak":"c", "Moderate":"b", "Strong":"a" };

    const Supplement = ({ name, cache, onOpenCategory, inStack, onAdd, onBack, onNav }) => {
      const { Icon, Tabbar } = window;
      const meta = SUPPLEMENTS.find(s => s.n === name) || { n:name, t:[] };
      const slugs = meta.t;
      const curated = CURATED_SUPPLEMENTS[name];   // our own open-source evidence entry
      const tierRank = { Primary:0, Secondary:1, Promising:2 };

      // Still waiting on any guide this supplement belongs to?
      const loading = slugs.some(slug => { const c = cache[slug]; return !c || c.loading; });

      // Collect every guide-entry that matches this supplement (there can be
      // more than one form per guide, e.g. blueberry variants).
      const appearances = [];
      slugs.forEach(slug => {
        const c = cache[slug] || {};
        (c.data?.supplements || []).forEach(entry => {
          if (_suppMatches(name, entry.name)) {
            appearances.push({ slug, title: c.data.title || (TOPIC_BY_SLUG[slug]?.name) || slug, entry });
          }
        });
      });
      appearances.sort((a,b) => (tierRank[a.entry.tier] ?? 9) - (tierRank[b.entry.tier] ?? 9));
      const best = appearances[0];            // strongest-evidence match
      const addName = best ? best.entry.name : name;
      const added = inStack(addName);
      // Guides to link to when we couldn't pull structured detail.
      const fallbackGuides = slugs.map(slug => ({ slug, name: (TOPIC_BY_SLUG[slug]?.name) || slug, icon: TOPIC_BY_SLUG[slug]?.icon }));

      return (
        <div className="screen-root">
          <div className="scroll" style={{height:'100%', paddingBottom:110}}>
            <div style={{background:'linear-gradient(160deg, var(--brand) 0%, var(--brand-deep) 100%)', color:'white', padding:'18px 22px 30px', position:'relative', overflow:'hidden'}}>
              <div style={{position:'absolute', top:-60, right:-40, width:200, height:200, borderRadius:'50%', background:'rgba(243,169,253,0.10)'}}/>
              <div style={{position:'absolute', bottom:-80, left:-40, width:240, height:240, borderRadius:'50%', background:'rgba(86,182,198,0.08)'}}/>
              <div style={{height:54}}/>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', position:'relative', zIndex:1}}>
                <button onClick={onBack} style={{width:36, height:36, borderRadius:'50%', background:'rgba(255,255,255,0.14)', display:'flex', alignItems:'center', justifyContent:'center', border:'none'}}><Icon.Back size={16} c="white"/></button>
                <button onClick={()=>onNav('ask')} style={{width:36, height:36, borderRadius:'50%', background:'rgba(255,255,255,0.14)', display:'flex', alignItems:'center', justifyContent:'center', border:'none'}}><Icon.Spark size={18} c="white"/></button>
              </div>
              <div style={{fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--accent-soft)', marginTop:22, fontWeight:600, position:'relative'}}>Supplement</div>
              <div className="serif" style={{fontSize:40, lineHeight:1.06, marginTop:8, position:'relative'}}>{name}</div>
              <div style={{fontSize:14, color:'rgba(255,255,255,0.78)', marginTop:8, maxWidth:'92%', position:'relative'}}>
                {curated ? <><i>{curated.aka}</i> · evidence summary from public research.</> : slugs.length ? <>Recommended in {slugs.length} of your evidence-based guide{slugs.length>1?'s':''} — here's how to take it and where it's backed.</> : 'Supplement details.'}
              </div>
            </div>

            {curated && (() => { const cadded = inStack(name); return (
              <div style={{padding:'22px 22px 6px'}}>
                <div className="serif" style={{fontSize:22, marginBottom:12, color:'var(--ink)'}}>Research <em style={{fontStyle:'italic', color:'var(--brand)'}}>summary</em></div>
                <div className="bal-card" style={{padding:'16px'}}>
                  <div style={{fontSize:13.5, color:'var(--ink-2)', lineHeight:1.5, marginBottom:12}}>{curated.summary}</div>
                  <div style={{display:'flex', flexWrap:'wrap', gap:8, marginBottom:12}}>
                    <span className="bal-pill light mono" style={{fontSize:11}}>{curated.dose}</span>
                  </div>
                  <div style={{fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--ink-3)', fontWeight:600, marginBottom:8}}>What the research suggests</div>
                  <div style={{marginBottom:12}}>
                    {curated.benefits.map((b,i) => (
                      <div key={i} style={{display:'flex', alignItems:'center', gap:10, padding:'7px 0', borderBottom:i<curated.benefits.length-1?'0.5px solid var(--rule)':'none'}}>
                        <div style={{flex:1, fontSize:13.5, color:'var(--ink)'}}>{b.claim}</div>
                        <span className={`ev-badge ${STRENGTH_TONE[b.strength]||'c'}`} style={{width:'auto', height:'auto', padding:'2px 9px', borderRadius:6, fontSize:10}}>{b.strength}</span>
                      </div>
                    ))}
                  </div>
                  <div style={{fontSize:12.5, color:'var(--ink-2)', lineHeight:1.5, marginBottom:12}}><b>Safety:</b> {curated.safety}</div>
                  {curated.note && <div style={{fontSize:12, color:'var(--ink-3)', lineHeight:1.5, marginBottom:12}}>{curated.note}</div>}
                  <div style={{display:'flex', gap:8, marginBottom:14, flexWrap:'wrap'}}>
                    <button onClick={()=>onAdd({ name, tier:'', dose:curated.dose, iherb_url: buyLinksForName(name)[0].url }, name)} disabled={cadded} style={{display:'inline-flex', alignItems:'center', gap:6, padding:'8px 14px', background:cadded?'var(--brand-soft)':'var(--brand)', color:cadded?'var(--brand)':'white', borderRadius:999, border:'none', fontSize:13, fontWeight:600}}>
                      {cadded ? <>Added <Icon.Check size={12} c="var(--brand)"/></> : <>Add to stack <Icon.Plus size={13} c="white"/></>}
                    </button>
                    {buyLinksForName(name).map(r => (
                      <a key={r.key} href={r.url} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex', alignItems:'center', gap:6, padding:'8px 14px', background:'var(--surface-3)', color:'var(--ink-2)', borderRadius:999, textDecoration:'none', fontSize:13, fontWeight:600}}>{r.name} <ExternalIcon c="var(--ink-2)"/></a>
                    ))}
                  </div>
                  <div style={{fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--ink-3)', fontWeight:600, marginBottom:8}}>Sources</div>
                  <div style={{display:'flex', flexWrap:'wrap', gap:7, marginBottom:12}}>
                    {curated.sources.map(s => (
                      <a key={s.url} href={s.url} target="_blank" rel="noopener noreferrer" className="bal-pill light" style={{padding:'6px 11px', fontSize:11.5, textDecoration:'none', display:'inline-flex', alignItems:'center', gap:5}}>{s.name} <ExternalIcon size={9} c="var(--brand)"/></a>
                    ))}
                  </div>
                  <div style={{fontSize:11, color:'var(--ink-3)', lineHeight:1.5, padding:'10px 12px', background:'var(--surface-3)', borderRadius:10}}>Summary of publicly available research (PubMed / open-access reviews), with Examine as a link-out. Educational, not medical advice — check with a healthcare professional.</div>
                </div>
              </div>
            ); })()}

            {!curated && loading && appearances.length===0 && <CategorySkeleton/>}

            {best && (
              <div style={{padding:'22px 22px 6px'}}>
                <div className="serif" style={{fontSize:22, marginBottom:12, color:'var(--ink)'}}>How to <em style={{fontStyle:'italic', color:'var(--brand)'}}>take it</em></div>
                <div className="bal-card" style={{padding:'14px 16px'}}>
                  {best.entry.name && _suppNorm(best.entry.name)!==_suppNorm(name) && <div style={{fontSize:13, fontWeight:600, color:'var(--ink)', marginBottom:4}}>{best.entry.name}</div>}
                  {best.entry.form && <div style={{fontStyle:'italic', color:'var(--ink-3)', fontSize:12, marginBottom:8}}>{best.entry.form}</div>}
                  <div style={{display:'flex', flexWrap:'wrap', gap:8}}>
                    {best.entry.dose && <span className="bal-pill light mono" style={{fontSize:11}}>{best.entry.dose}</span>}
                    {best.entry.timing && <span className="bal-pill light mono" style={{fontSize:11}}>{best.entry.timing}</span>}
                  </div>
                  {best.entry.evidence && <div style={{fontSize:13, color:'var(--ink-2)', lineHeight:1.45, marginTop:8}}>{best.entry.evidence}</div>}
                  <div style={{display:'flex', gap:8, marginTop:10, flexWrap:'wrap'}}>
                    <button onClick={()=>onAdd(best.entry, best.title)} disabled={added} style={{display:'inline-flex', alignItems:'center', gap:6, padding:'8px 14px', background:added?'var(--brand-soft)':'var(--brand)', color:added?'var(--brand)':'white', borderRadius:999, border:'none', fontSize:13, fontWeight:600}}>
                      {added ? <>Added <Icon.Check size={12} c="var(--brand)"/></> : <>Add to stack <Icon.Plus size={13} c="white"/></>}
                    </button>
                    {buyLinksForName(addName, best.entry.iherb_url).map(r => (
                      <a key={r.key} href={r.url} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex', alignItems:'center', gap:6, padding:'8px 14px', background:'var(--surface-3)', color:'var(--ink-2)', borderRadius:999, textDecoration:'none', fontSize:13, fontWeight:600}}>{r.name} <ExternalIcon c="var(--ink-2)"/></a>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {appearances.length>0 ? (
              <div style={{padding:'24px 22px 6px'}}>
                <div className="serif" style={{fontSize:22, marginBottom:6, color:'var(--ink)'}}>In your <em style={{fontStyle:'italic', color:'var(--brand)'}}>guides</em></div>
                <div style={{fontSize:13, color:'var(--ink-3)', marginBottom:14}}>Where {name} is recommended, and its evidence tier in each. Tap to open the guide.</div>
                {appearances.map((a,i) => (
                  <button key={a.slug+':'+i} onClick={()=>onOpenCategory(a.slug)} className="bal-card" style={{width:'100%', textAlign:'left', border:'none', padding:'14px 16px', marginBottom:10, display:'flex', alignItems:'center', gap:12, cursor:'pointer'}}>
                    <div className={`ev-badge ${GRADE[a.entry.tier]||'c'}`}>{GRADE_LETTER[a.entry.tier]||'·'}</div>
                    <div style={{flex:1, minWidth:0}}>
                      <div style={{fontSize:15, fontWeight:600, color:'var(--ink)'}}>{a.title}</div>
                      <div style={{fontSize:12, color:'var(--ink-3)', marginTop:2, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{a.entry.tier}{_suppNorm(a.entry.name)!==_suppNorm(name) ? ' · ' + a.entry.name : ''}{a.entry.dose ? ' · ' + a.entry.dose : ''}</div>
                    </div>
                    <Icon.Chevron size={13} c="var(--ink-4)"/>
                  </button>
                ))}
                <div style={{fontSize:11, color:'var(--ink-3)', textAlign:'center', padding:'18px 8px 24px', lineHeight:1.5}}>Always check with your healthcare provider before starting any new supplement, especially if you take medication or have a health condition.</div>
              </div>
            ) : (!curated && !loading && slugs.length>0 && (
              <div style={{padding:'24px 22px 6px'}}>
                <div className="serif" style={{fontSize:22, marginBottom:6, color:'var(--ink)'}}>In your <em style={{fontStyle:'italic', color:'var(--brand)'}}>guides</em></div>
                <div style={{fontSize:13, color:'var(--ink-3)', marginBottom:14}}>{name} is recommended in your {fallbackGuides.map(g=>g.name).join(' · ')} guide{slugs.length>1?'s':''}. Open one to see the full stack and dosing.</div>
                {fallbackGuides.map(g => { const Ic = Icon[g.icon]; return (
                  <button key={g.slug} onClick={()=>onOpenCategory(g.slug)} className="bal-card" style={{width:'100%', textAlign:'left', border:'none', padding:'14px 16px', marginBottom:10, display:'flex', alignItems:'center', gap:12, cursor:'pointer'}}>
                    <div style={{width:32, height:32, borderRadius:10, background:'var(--brand-soft)', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center'}}>{Ic ? <Ic size={18} c="var(--brand)"/> : null}</div>
                    <div style={{flex:1, minWidth:0, fontSize:15, fontWeight:600, color:'var(--ink)'}}>{g.name}</div>
                    <Icon.Chevron size={13} c="var(--ink-4)"/>
                  </button>
                ); })}
                <div style={{fontSize:11, color:'var(--ink-3)', textAlign:'center', padding:'18px 8px 24px', lineHeight:1.5}}>Always check with your healthcare provider before starting any new supplement, especially if you take medication or have a health condition.</div>
              </div>
            ))}
          </div>
          <Tabbar active="browse" onNav={onNav}/>
        </div>
      );
    };

    // ============ Substance support detail ============
    const Substance = ({ sub, onAdd, inStack, onBack, onNav }) => {
      const { Icon, Tabbar } = window;
      if (!sub) return null;
      return (
        <div className="screen-root">
          <div className="scroll" style={{height:'100%', paddingBottom:110}}>
            <div style={{background:'linear-gradient(160deg, var(--brand) 0%, var(--brand-deep) 100%)', color:'white', padding:'18px 22px 30px', position:'relative', overflow:'hidden'}}>
              <div style={{position:'absolute', top:-60, right:-40, width:200, height:200, borderRadius:'50%', background:'rgba(243,169,253,0.10)'}}/>
              <div style={{height:54}}/>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', position:'relative', zIndex:1}}>

            </div>

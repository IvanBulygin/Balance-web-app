services:
  - type: web
    name: balance-ai-rag-demo
    runtime: python
    rootDir: rag_demo
    plan: starter
    buildCommand: pip install -r requirements.txt && python build_index.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"

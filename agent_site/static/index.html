<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>Balance AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.0/dist/purify.min.js"></script>
<style>
:root{
--brand:#5521E5;--brand-deep:#20056C;--brand-soft:#ECE5FC;
--accent:#E978DA;--accent-soft:#FDE2F8;
--c-cyan:#56B6C6;--c-blue:#3FA9F5;--c-indigo:#559BF0;--c-violet:#8E77E2;--c-magenta:#E978DA;--c-pink:#F3A9FD;
--bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#FAFAFA;--surface-3:#F0F0F3;
--ink:#050304;--ink-2:#3D3D3D;--ink-3:#7F7F7F;--ink-4:#A6A6A6;--rule:#E5E5E5;
--green:#7AC97F;--green-soft:#D8F1DA;--aqua:#56B6C6;
--grad:linear-gradient(95deg,#56B6C6 0%,#3FA9F5 22%,#559BF0 38%,#8E77E2 56%,#E978DA 78%,#F3A9FD 100%);
--r-sm:12px;--r-md:18px;--r-lg:26px;--r-xl:32px;
--sh-1:0 1px 2px rgba(32,5,108,.05),0 2px 8px rgba(32,5,108,.05);
--sh-2:0 8px 24px rgba(32,5,108,.08);
--sh-card:0 1px 0 rgba(32,5,108,.03),0 8px 28px rgba(32,5,108,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
background:radial-gradient(circle at 80% 0%,rgba(243,169,253,.06) 0%,transparent 50%),
radial-gradient(circle at 0% 60%,rgba(86,182,198,.05) 0%,transparent 50%),#fafafa;
font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:15px;
color:var(--ink);-webkit-font-smoothing:antialiased;
display:flex;align-items:center;justify-content:center;
}
.serif{font-family:'Fraunces','Georgia',serif;font-weight:600;letter-spacing:-.02em;font-variation-settings:'opsz' 144}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.phone{width:390px;height:844px;border-radius:54px;background:#111;padding:10px;
box-shadow:0 30px 60px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.08);position:relative}
.phone-inner{width:100%;height:100%;border-radius:46px;overflow:hidden;position:relative;background:var(--bg)}
.dyn-island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:100}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex}
.screen-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen-scroll::-webkit-scrollbar{display:none}
.bal-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-card)}
.ev-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;font-size:11px;font-weight:700;font-family:'Fraunces',Georgia,serif}
.ev-badge.a{background:var(--brand);color:#fff}
.ev-badge.b{background:var(--accent);color:#fff}
.ev-badge.c{background:var(--accent-soft);color:var(--brand)}
.bal-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em;background:var(--brand-soft);color:var(--brand-deep)}
.bal-pill.accent{background:var(--accent-soft);color:var(--brand)}
.bal-pill.dark{background:var(--brand);color:#fff}
.bal-pill.light{background:var(--surface-3);color:var(--ink-2)}
.tabbar{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);
backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
border-top:.5px solid var(--rule);padding:10px 20px 28px;display:flex;justify-content:space-around;z-index:50}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--ink-4);cursor:pointer;letter-spacing:.02em}
.tab-item.active{color:var(--brand)}
.tab-item svg{width:22px;height:22px}

@media(max-width:430px){
.phone{width:100vw;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none}
.phone-inner{border-radius:0}
.dyn-island{display:none}
body{background:var(--bg)}
}
</style>
</head>
<body>
<div class="phone"><div class="phone-inner">
<div class="dyn-island"></div>

<!-- SCREENS -->
<div id="scr-today" class="screen active">
  <div class="screen-scroll" style="padding-bottom:90px">
    <div style="height:54px"></div>
    <div id="today-content"></div>
  </div>
</div>

<div id="scr-ask" class="screen">
  <div id="ask-content" style="display:flex;flex-direction:column;height:100%">
    <div style="height:54px;flex-shrink:0"></div>
    <!-- Ask header -->
    <div style="padding:8px 18px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
      <div onclick="nav('today')" style="width:36px;height:36px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-1);cursor:pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </div>
      <div style="font-size:13px;color:var(--ink-3);font-weight:500">Today's chat</div>
      <div onclick="newChat()" style="width:36px;height:36px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-1);cursor:pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>
    <!-- Messages -->
    <div id="ask-messages" class="screen-scroll" style="flex:1;padding:0 18px 80px">
      <!-- Welcome state -->
      <div id="ask-welcome" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 28px 20px;text-align:center">
        <div style="width:48px;height:48px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;margin-bottom:16px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/><circle cx="12" cy="12" r="2.2" fill="var(--accent)" stroke="none"/></svg>
        </div>
        <div class="serif" style="font-size:22px;line-height:1.25;margin-bottom:8px">Ask anything about<br>your health</div>
        <div style="font-size:13px;color:var(--ink-3);line-height:1.5;max-width:280px">I search 17 evidence-based guides and return ranked supplements with dose, timing, and grade.</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;justify-content:center">
          <div onclick="sendMessage('What helps me fall asleep faster?')" style="padding:8px 14px;background:var(--surface);border:.5px solid var(--rule);border-radius:999px;font-size:13px;color:var(--brand-deep);font-weight:500;cursor:pointer">Best for sleep?</div>
          <div onclick="sendMessage('How to improve afternoon energy?')" style="padding:8px 14px;background:var(--surface);border:.5px solid var(--rule);border-radius:999px;font-size:13px;color:var(--brand-deep);font-weight:500;cursor:pointer">Afternoon energy</div>
          <div onclick="sendMessage('What supplements help with stress and anxiety?')" style="padding:8px 14px;background:var(--surface);border:.5px solid var(--rule);border-radius:999px;font-size:13px;color:var(--brand-deep);font-weight:500;cursor:pointer">Stress relief</div>
          <div onclick="sendMessage('Best supplements for muscle recovery?')" style="padding:8px 14px;background:var(--surface);border:.5px solid var(--rule);border-radius:999px;font-size:13px;color:var(--brand-deep);font-weight:500;cursor:pointer">Muscle recovery</div>
        </div>
      </div>
    </div>
    <!-- Composer -->
    <div style="padding:12px 16px 24px;background:linear-gradient(to top,var(--bg) 60%,transparent);flex-shrink:0">
      <form id="ask-form" style="background:var(--surface);border-radius:22px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--sh-2)">
        <input id="ask-input" type="text" placeholder="Ask anything about your health…" autocomplete="off" style="flex:1;border:none;outline:none;font-size:14px;font-family:inherit;background:transparent;color:var(--ink)"/>
        <button type="submit" id="ask-send" style="width:34px;height:34px;border-radius:50%;background:var(--brand);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--brand-soft)"><path d="M3 12l18-8-8 18-2-8-8-2z"/></svg>
        </button>
      </form>
    </div>
  </div>
</div>

<div id="scr-stack" class="screen">
  <div class="screen-scroll" style="padding-bottom:90px">
    <div style="height:54px"></div>
    <div id="stack-content"></div>
  </div>
</div>

<div id="scr-learn" class="screen">
  <div class="screen-scroll" style="padding-bottom:90px">
    <div style="height:54px"></div>
    <div id="learn-content"></div>
  </div>
</div>

<div id="scr-me" class="screen">
  <div class="screen-scroll" style="padding-bottom:90px">
    <div style="height:54px"></div>
    <div id="me-content"></div>
  </div>
</div>

<!-- TABBAR -->
<div class="tabbar" id="tabbar"></div>
</div></div>

<script>
// Forward declarations for Ask screen
var chatHistory=[];
function newChat(){}
function sendMessage(){}

// TAB BAR + NAV
const TABS=[
{k:'today',l:'Today',icon:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11L12 4l9 7"/><path d="M5 10v10h14V10"/></svg>'},
{k:'ask',l:'Ask',icon:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg>'},
{k:'stack',l:'Stack',icon:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3l8 4-8 4-8-4 8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 17l8 4 8-4"/></svg>'},
{k:'learn',l:'Learn',icon:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2V5z"/><path d="M19 3v18"/></svg>'},
{k:'me',l:'Me',icon:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>'}
];
function renderTabbar(){
const tb=document.getElementById('tabbar');
tb.innerHTML=TABS.map(t=>`<div class="tab-item${t.k==='today'?' active':''}" data-tab="${t.k}">${t.icon}<div>${t.l}</div></div>`).join('');
tb.addEventListener('click',e=>{
const item=e.target.closest('.tab-item');if(!item)return;
const k=item.dataset.tab;nav(k);
});
}
function nav(k){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
const scr=document.getElementById('scr-'+k);if(scr)scr.classList.add('active');
document.querySelectorAll('.tab-item').forEach(t=>{t.classList.toggle('active',t.dataset.tab===k)});
if(k==='ask'){var ai=document.getElementById('ask-input');if(ai)ai.focus();}
}
renderTabbar();
</script>

<!-- TODAY SCREEN -->
<script>
document.getElementById('today-content').innerHTML=`
<div style="padding:14px 22px 8px">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div>
      <div class="mono" style="font-size:12px;color:var(--ink-3);font-weight:500;letter-spacing:.06em;text-transform:uppercase">Fri &middot; Apr 25</div>
      <div class="serif" style="font-size:34px;line-height:1.05;margin-top:2px">Good morning,<br><em style="font-style:italic">Sam</em>.</div>
    </div>
    <div style="width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-weight:600">S</div>
  </div>
</div>

<div style="padding:16px 18px 0">
  <div class="bal-card" style="background:var(--brand);color:var(--brand-soft);padding:20px;border-radius:22px;position:relative;overflow:hidden">
    <div style="position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:50%;background:rgba(243,169,253,.08)"></div>
    <div style="position:absolute;right:-60px;bottom:-60px;width:140px;height:140px;border-radius:50%;background:rgba(233,120,218,.06)"></div>
    <div style="position:relative">
      <div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-soft);font-weight:600">Tonight's nudge</div>
      <div class="serif" style="font-size:26px;line-height:1.15;margin-top:10px;color:#fff">Take magnesium <em>45 min</em> before bed.</div>
      <div style="font-size:13px;color:var(--brand-soft);margin-top:10px;line-height:1.4">You asked about falling asleep yesterday. This is your best first move.</div>
      <div style="display:flex;gap:8px;margin-top:14px;align-items:center">
        <div class="ev-badge" style="background:var(--brand-soft);color:var(--brand)">A</div>
        <span style="font-size:12px;color:var(--brand-soft)">Grade A evidence &middot; 4 RCTs</span>
      </div>
    </div>
  </div>
</div>

<div style="padding:18px 18px 0">
  <div class="bal-card" style="padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer" onclick="nav('ask')">
    <div style="width:28px;height:28px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/><circle cx="12" cy="12" r="2.2" fill="var(--accent)" stroke="none"/></svg>
    </div>
    <div style="flex:1;color:var(--ink-3);font-size:14px">Ask anything about your health&hellip;</div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="var(--ink-3)"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
  </div>
  <div style="display:flex;gap:8px;margin-top:12px;overflow:hidden">
    <div class="bal-pill light" style="padding:7px 12px;font-size:12px;cursor:pointer" onclick="askQuestion('How to improve afternoon energy?')">Afternoon energy?</div>
    <div class="bal-pill light" style="padding:7px 12px;font-size:12px;cursor:pointer" onclick="askQuestion('Best supplements for sore joints?')">Sore joints</div>
    <div class="bal-pill light" style="padding:7px 12px;font-size:12px;cursor:pointer" onclick="nav('ask')">+</div>
  </div>
</div>

<div style="padding:22px 18px 0">
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
    <div class="serif" style="font-size:22px">Today's stack</div>
    <div style="font-size:12px;color:var(--accent);font-weight:500">3 of 5 done</div>
  </div>
  <div class="bal-card" style="padding:4px 0" id="today-stack"></div>
</div>

<div style="padding:22px 18px 20px">
  <div class="serif" style="font-size:22px;margin-bottom:10px">What's working</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="bal-card" style="padding:14px">
      <div style="font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-weight:600">Sleep onset</div>
      <div style="display:flex;align-items:baseline;gap:4px;margin-top:6px">
        <div class="serif" style="font-size:30px;color:var(--brand)">&minus;17</div>
        <div style="font-size:12px;color:var(--ink-3)">min</div>
      </div>
      <div style="font-size:11px;color:var(--ink-3);margin-top:2px">8-week avg</div>
      <div style="display:flex;align-items:flex-end;gap:3px;margin-top:10px;height:26px" id="sleep-bars"></div>
    </div>
    <div class="bal-card" style="padding:14px">
      <div style="font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-weight:600">Streak</div>
      <div style="display:flex;align-items:baseline;gap:4px;margin-top:6px">
        <div class="serif" style="font-size:30px;color:var(--accent)">12</div>
        <div style="font-size:12px;color:var(--ink-3)">days</div>
      </div>
      <div style="font-size:11px;color:var(--ink-3);margin-top:2px">Logging daily</div>
      <div style="display:flex;gap:3px;margin-top:10px" id="streak-bars"></div>
    </div>
  </div>
</div>
`;

// Render stack rows
const stackItems=[
{n:'Creatine',d:'5 g · morning',done:true,g:'A'},
{n:'Vitamin D3',d:'2000 IU · with food',done:true,g:'B'},
{n:'Omega-3 EPA',d:'1 g · lunch',done:true,g:'A'},
{n:'Magnesium glycinate',d:'300 mg · 9:00 PM',done:false,g:'A',next:true},
{n:'Ashwagandha',d:'600 mg · 9:00 PM',done:false,g:'B'}
];
document.getElementById('today-stack').innerHTML=stackItems.map((it,i)=>`
<div style="display:flex;align-items:center;padding:12px 16px;border-bottom:${i<stackItems.length-1?'.5px solid var(--rule)':'none'}">
  <div style="width:22px;height:22px;border-radius:50%;background:${it.done?'var(--brand)':'transparent'};border:${it.done?'none':'1.6px solid var(--rule)'};display:flex;align-items:center;justify-content:center;margin-right:12px">
    ${it.done?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--brand-soft)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-11"/></svg>':''}
  </div>
  <div style="flex:1">
    <div style="font-size:14px;font-weight:500;color:${it.done?'var(--ink-3)':'var(--ink)'};text-decoration:${it.done?'line-through':'none'}">${it.n}</div>
    <div style="font-size:12px;color:var(--ink-3);margin-top:1px">${it.d}</div>
  </div>
  ${it.next?'<div class="bal-pill accent" style="margin-right:8px;font-size:10px">NEXT</div>':''}
  <div class="ev-badge ${it.g.toLowerCase()}">${it.g}</div>
</div>`).join('');

// Sleep bars
document.getElementById('sleep-bars').innerHTML=[30,34,31,40,52,58,63,70].map((h,i)=>
`<div style="flex:1;height:${h}%;background:${i>3?'var(--brand)':'var(--brand-soft)'};border-radius:2px 2px 0 0"></div>`).join('');

// Streak bars
document.getElementById('streak-bars').innerHTML=Array.from({length:7}).map((_,i)=>
`<div style="flex:1;height:8px;border-radius:2px;background:${i<6?'var(--accent)':'var(--surface-3)'}"></div>`).join('');
</script>

<!-- ASK SCREEN (chat) -->
<style>
#ask-messages{padding:0 18px}
.msg-user{display:flex;justify-content:flex-end;padding-top:18px}
.msg-user .bubble{max-width:80%;background:var(--brand);color:var(--brand-soft);padding:11px 15px;border-radius:20px 20px 4px 20px;font-size:14px;line-height:1.4}
.msg-ai{padding-top:14px}
.msg-ai .ai-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.msg-ai .ai-spark{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center}
.msg-ai .ai-body{margin-left:34px;font-size:14px;color:var(--ink-2);line-height:1.55}
.msg-ai .ai-body h3{font-family:'Fraunces',Georgia,serif;font-size:18px;font-weight:600;color:var(--ink);margin:16px 0 8px;letter-spacing:-.02em}
.msg-ai .ai-body ol{padding-left:0;list-style:none;counter-reset:supp}
.msg-ai .ai-body ol>li{counter-increment:supp;margin-bottom:12px;padding:12px 14px;background:var(--surface-2);border-radius:var(--r-sm);border:.5px solid var(--rule)}
.msg-ai .ai-body ol>li strong{color:var(--ink)}
.msg-ai .ai-body ol>li code{font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 7px;border-radius:999px;font-weight:600}
.msg-ai .ai-body ol>li[data-tier="primary"] code{background:var(--brand);color:#fff}
.msg-ai .ai-body ol>li[data-tier="secondary"] code{background:var(--accent);color:#fff}

<script>
marked.setOptions({gfm:true,breaks:true});
function md(t){try{return DOMPurify.sanitize(marked.parse(t||''),{USE_PROFILES:{html:true}})}catch(e){const d=document.createElement('div');d.textContent=t;return d.innerHTML}}
function tagTiers(root){
const tiers=['primary','secondary','promising','combo','unproven'];
root.querySelectorAll('ol > li').forEach(li=>{
const c=li.querySelector(':scope > p > code, :scope > code, :scope > strong + code, p > strong + code');
if(!c)return;const txt=(c.textContent||'').trim().toLowerCase();
if(tiers.includes(txt))li.setAttribute('data-tier',txt);
});
}

function addMsg(role,html,opts={}){
const msgs=document.getElementById('ask-messages');
const wrap=document.createElement('div');
wrap.className=role==='user'?'msg-user':'msg-ai';
if(role==='user'){wrap.innerHTML=`<div class="bubble">${html}</div>`;
}else{
wrap.innerHTML=`<div class="ai-header">

</div>
<div class="ai-body">${html}</div>`;
}
msgs.appendChild(wrap);msgs.scrollTop=msgs.scrollHeight;
return{wrapper:wrap,content:wrap.querySelector('.ai-body')||wrap.querySelector('.bubble')};
}

function renderSources(wrapper,sources){
if(!sources||!sources.length)return;
const d=document.createElement('div');d.className='sources';
d.innerHTML=sources.map(s=>`<span class="src">${s}</span>`).join('');
wrapper.appendChild(d);
}

async function sendMessage(text){
if(!text)return;
// Switch to ask screen if not already there
var askScr=document.getElementById('scr-ask');
if(!askScr.classList.contains('active'))nav('ask');
// Clear welcome state on first message
var w=document.getElementById('ask-welcome');
if(w)w.remove();
addMsg('user',text);chatHistory.push({role:'user',content:text});
const btn=document.getElementById('ask-send');btn.disabled=true;
const p=addMsg('assistant','<div class="thinking-dots"><span></span><span></span><span></span></div>');
try{
const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:chatHistory})});
if(!r.ok)throw new Error('HTTP '+r.status);
const data=await r.json();
p.content.innerHTML=md(data.reply);tagTiers(p.content);
renderSources(p.wrapper,data.sources);
chatHistory.push({role:'assistant',content:data.reply});
}catch(err){p.content.innerHTML='<em>Error: '+(err.message||'request failed')+'</em>'}
finally{btn.disabled=false;document.getElementById('ask-input').focus();
document.getElementById('ask-messages').scrollTop=document.getElementById('ask-messages').scrollHeight}
}

        <div style="font-size:12px;color:var(--ink-3);margin-top:1px">${r.note}</div>
      </div>
      ${!r.good?'<div style="font-size:12px;color:var(--accent);font-weight:500;cursor:pointer">Drop?</div>':''}
    </div>`).join('')}
  </div>
</div>
`;
</script>

</body>
</html>

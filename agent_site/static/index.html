    @font-face { font-family:'Priego'; font-weight:300; src:url('/static/fonts/Priego-Light.otf') format('opentype'); font-display:swap; unicode-range:U+0020, U+002C, U+002E, U+0030-0033, U+0035-003B, U+003F, U+0041-005A, U+0061-007A; }

    .phone-frame { width:100%; max-width:100vw; min-height:100vh; background:var(--bg); position:relative; overflow:hidden; }

    .bal-pill.accent { background:var(--accent-soft); color:var(--brand); }

    .bal-pill.light { background:var(--surface-3); color:var(--ink-2); }
    .ev-badge { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:7px; font-size:11px; font-weight:700; font-family:'Priego','Fraunces',Georgia,serif; }
    .ev-badge.a { background:var(--brand); color:white; }
    .ev-badge.b { background:var(--accent); color:white; }

    .bal-card { background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--sh-card); }
    .tabbar { position:absolute; left:0; right:0; bottom:0; background:rgba(255,255,255,.92); backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%); border-top:0.5px solid var(--rule); padding:10px 20px 28px; display:flex; justify-content:space-around; z-index:10; }
    .tab-item { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-weight:600; color:var(--ink-4); letter-spacing:.02em; cursor:pointer; background:none; border:none; }
    .tab-item.active { color:var(--brand); }
    .tab-item svg { width:22px; height:22px; }
    .bal-mark { display:inline-flex; align-items:baseline; gap:2px; font-family:'Priego','Fraunces',Georgia,serif; font-weight:700; letter-spacing:-.04em; }
    .bal-mark .a { background:var(--grad-radial); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .bal-mark .ai { font-size:.45em; vertical-align:super; margin-left:1px; background:var(--grad-radial); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:700; }
    button { font-family:inherit; cursor:pointer; }
    @keyframes balShimmer { 0% { background-position:100% 50%; } 100% { background-position:0% 50%; } }

              {stack.length===0 ? (
                <button onClick={()=>onNav('browse')} className="bal-card" style={{width:'100%', textAlign:'left', border:'none', padding:18, color:'var(--ink-2)', fontSize:14}}>
                  No supplements yet. <span style={{color:'var(--brand)', fontWeight:600}}>Open a guide →</span> to build your stack.
                </button>
              ) : (
                <div className="bal-card" style={{padding:'4px 0'}}>
                  {stack.map((it,i,arr) => { const done = taken.includes(it.name); return (
                    <div key={i} style={{display:'flex', alignItems:'center', padding:'12px 16px', borderBottom:i<arr.length-1?'0.5px solid var(--rule)':'none'}}>
                      <button onClick={()=>onToggleTaken(it.name)} style={{width:22, height:22, borderRadius:'50%', background:done?'var(--brand)':'transparent', border:done?'none':'1.6px solid var(--rule)', display:'flex', alignItems:'center', justifyContent:'center', marginRight:12, padding:0}}>{done && <Icon.Check size={12} c="white"/>}</button>
                      <div style={{flex:1}}>
                        <div style={{fontSize:14, fontWeight:500, color:done?'var(--ink-3)':'var(--ink)', textDecoration:done?'line-through':'none'}}>{it.name}</div>
                        <div style={{fontSize:12, color:'var(--ink-3)', marginTop:1}}>{[it.dose, it.timing].filter(Boolean).join(' · ')}</div>
                      </div>
                      <div className={`ev-badge ${GRADE[it.tier]||'c'}`}>{GRADE_LETTER[it.tier]||'·'}</div>
                    </div>
                  ); })}
                </div>
              )}
            </div>
          </div>
          <Tabbar active="home" onNav={onNav}/>
        </div>
      );
    };

    // ============ Ask (functional chat) ============
    // Turn raw "supplement-guide-memory-focus" mentions into friendly names.
    const prettyGuide = (slug) => (TOPIC_BY_SLUG[slug] && TOPIC_BY_SLUG[slug].name) || slug.replace(/-/g,' ').replace(/\b\w/g, c => c.toUpperCase());
    const cleanText = (t) => (t||'').replace(/supplement-guide-([a-z0-9-]+)/g, (_, s) => prettyGuide(s));

    // Inline formatting: **bold**, *italic*, and `code` — where a backtick tier
    // (`Primary`/`Secondary`/`Promising`) becomes a colored evidence badge.
    const TIER_TONE = { primary:'a', secondary:'b', promising:'c' };
    const inline = (s) => {
      const out = []; let k = 0, last = 0, m;
      const re = /(`[^`]+`|\*\*[^*]+\*\*|\*[^*\n]+\*)/g;
      while ((m = re.exec(s)) !== null) {
        if (m.index > last) out.push(<React.Fragment key={k++}>{s.slice(last, m.index)}</React.Fragment>);
        const tok = m[0];
        if (tok[0] === '`') {
          const inner = tok.slice(1, -1);
          const tone = TIER_TONE[inner.toLowerCase()];
          if (tone) out.push(<span key={k++} className={`ev-badge ${tone}`} style={{width:'auto', height:'auto', padding:'1px 8px', borderRadius:6, fontSize:10, marginLeft:4, verticalAlign:'middle'}}>{inner}</span>);
          else out.push(<code key={k++} className="mono" style={{background:'var(--surface-3)', padding:'1px 5px', borderRadius:5, fontSize:'0.92em'}}>{inner}</code>);
        } else if (tok.startsWith('**')) {
          out.push(<strong key={k++}>{tok.slice(2, -2)}</strong>);
        } else {
          out.push(<em key={k++}>{tok.slice(1, -1)}</em>);
        }
        last = re.lastIndex;
      }
      if (last < s.length) out.push(<React.Fragment key={k++}>{s.slice(last)}</React.Fragment>);
      return out;
    };

    // Block formatting: headings, numbered list (supplement entries), bullets
    // (sub-fields), blockquote (safety note), paragraphs.
    const fmt = (text) => {
      const lines = cleanText(text).split('\n');
      const out = []; let key = 0;
      for (const ln of lines) {
        if (/^#{1,3}\s+/.test(ln)) { out.push(<div key={key++} className="serif" style={{fontSize:17, margin:'16px 0 8px', color:'var(--ink)'}}>{inline(ln.replace(/^#{1,3}\s+/,''))}</div>); continue; }
        if (/^>\s+/.test(ln)) { out.push(<div key={key++} style={{borderLeft:'3px solid var(--accent)', background:'var(--accent-soft)', padding:'10px 12px', borderRadius:'0 10px 10px 0', color:'var(--brand-deep)', fontSize:13, lineHeight:1.5, margin:'12px 0 4px'}}>{inline(ln.replace(/^>\s+/,''))}</div>); continue; }
        const num = ln.match(/^(\d+)\.\s+(.*)$/);
        if (num) { out.push(<div key={key++} style={{display:'flex', gap:10, margin:'12px 0 2px', alignItems:'baseline'}}><span className="serif" style={{color:'var(--brand)', fontSize:15, minWidth:18}}>{num[1]}.</span><span style={{flex:1, fontSize:15}}>{inline(num[2])}</span></div>); continue; }
        if (/^\s*[-*]\s+/.test(ln)) { out.push(<div key={key++} style={{display:'flex', gap:8, margin:'3px 0 3px 28px'}}><span style={{color:'var(--ink-4)', lineHeight:1.5}}>•</span><span style={{flex:1}}>{inline(ln.replace(/^\s*[-*]\s+/,''))}</span></div>); continue; }
        if (ln.trim() === '') { out.push(<div key={key++} style={{height:8}}/>); continue; }
        out.push(<div key={key++} style={{margin:'4px 0'}}>{inline(ln)}</div>);
      }
      return out;
    };

    // ============ In-chat order flow (SIMULATED CartAI) ============
    // A fully self-contained, fake CartAI checkout that runs inside the chat.
    // No network, no real money, no real product — it mimics CartAI's state
    // machine (QUEUED → STARTED → IN_PROGRESS → SUCCEEDED) for a believable
    // demo. (The real /api/checkout integration on the Stack screen is a
    // separate, key-gated path — CartAI's live API is currently down.)
    const CartIcon = ({size=18, c='currentColor'}) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2 3h3l2.3 12.2a1 1 0 001 .8h8.8a1 1 0 001-.8L21 7H6"/></svg>
    );
    const SAMPLE_CART = [
      { name:'Magnesium Glycinate', tier:'Primary',   dose:'300 mg', iherb_url:'https://www.iherb.com/search?kw=magnesium+glycinate' },
      { name:'Creatine Monohydrate', tier:'Secondary', dose:'5 g',     iherb_url:'https://www.iherb.com/search?kw=creatine+monohydrate' },
      { name:'Vitamin D3',           tier:'Secondary', dose:'2000 IU', iherb_url:'https://www.iherb.com/search?kw=vitamin+d3' },
    ];
    const fakePrice = (name) => { let h=0; for (let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0; return 6.99 + (h % 1800)/100; };
    const money = (n) => '$' + n.toFixed(2);
    const ORDER_STEPS = [
      { s:'QUEUED',      label:'Order received — queued' },
      { s:'STARTED',     label:'CartAI agent starting' },
      { s:'IN_PROGRESS', label:'Navigating to iHerb' },
      { s:'IN_PROGRESS', label:'Adding items to cart' },
      { s:'IN_PROGRESS', label:'Entering shipping & payment' },
      { s:'IN_PROGRESS', label:'Placing your order' },
      { s:'SUCCEEDED',   label:'Order confirmed' },
    ];

    // Defined at module scope (NOT inside OrderFlow) so its identity is stable
    // across re-renders — otherwise React remounts the form on every keystroke
    // and the focused input loses focus.
    const OrderCard = ({ children }) => (
      <div className="bal-card" style={{marginLeft:34, marginTop:4, padding:0, overflow:'hidden', border:'1px solid var(--rule)'}}>
        <div style={{padding:'10px 14px', background:'var(--brand-soft)', display:'flex', alignItems:'center', justifyContent:'space-between'}}>
          <div style={{display:'flex', alignItems:'center', gap:8}}><CartIcon size={15} c="var(--brand)"/><span style={{fontSize:12, fontWeight:600, color:'var(--brand-deep)'}}>CartAI checkout</span></div>
          <span className="mono" style={{fontSize:9, letterSpacing:'.1em', color:'var(--brand)', background:'white', padding:'2px 7px', borderRadius:5}}>TEST MODE</span>
        </div>
        <div style={{padding:'14px'}}>{children}</div>
      </div>
    );

    const OrderFlow = ({ items, answer }) => {
      const { Icon } = window;
      const fullCart = (items && items.length) ? items : SAMPLE_CART;
      const usingSample = !(items && items.length);
      const [stage, setStage] = useState('cart');          // cart | details | processing | done
      const [addr, setAddr] = useState(() => ({ ...blankAddress(), ...LS.get('bal_addr', {}) }));
      const [stepIdx, setStepIdx] = useState(0);
      const [order, setOrder] = useState(null);
      // Double-check: every line item starts approved; the user can untick any
      // before checkout so the order matches exactly what they want to buy.
      const [confirmed, setConfirmed] = useState(() => new Set(fullCart.map((_,i)=>i)));
      const toggleItem = (i) => setConfirmed(prev => { const n = new Set(prev); n.has(i) ? n.delete(i) : n.add(i); return n; });
      const cart = useMemo(() => fullCart.filter((_,i)=>confirmed.has(i)), [fullCart, confirmed]);

      useEffect(() => { LS.set('bal_addr', addr); }, [addr]);
      const set = (k,v) => setAddr(a => ({ ...a, [k]: v }));
      const subtotal = useMemo(() => cart.reduce((a,it)=>a+fakePrice(it.name),0), [cart]);
      const shipping = 4.99;
      const total = subtotal + shipping;
      const detailsValid = ['firstName','lastName','addressLine1','city','postalCode'].every(k => (addr[k]||'').trim());

      // Drive the simulated CartAI state machine.
      useEffect(() => {
        if (stage !== 'processing') return;
        let i = 0; setStepIdx(0);
        let timer = setTimeout(function tick(){
          i += 1;
          if (i < ORDER_STEPS.length) { setStepIdx(i); timer = setTimeout(tick, 1150); }
          else {
            setOrder({
              num: 'BAL-' + Math.random().toString(36).slice(2,7).toUpperCase(),
              eta: new Date(Date.now()+4*864e5).toLocaleDateString(undefined,{month:'short', day:'numeric'}),
              total, items: cart.length,
            });
            setStage('done');
          }
        }, 1150);
        return () => clearTimeout(timer);
      }, [stage]);

      if (stage === 'cart') return (
        <OrderCard>
          {usingSample && <div style={{fontSize:12, color:'var(--ink-3)', marginBottom:10}}>Your stack was empty, so here's a sample cart you can order.</div>}
          <div style={{fontSize:12, color:'var(--ink-3)', marginBottom:8}}>{answer ? `Double-check the ${fullCart.length} supplement${fullCart.length>1?'s':''} from the answer before ordering — untick anything you don't want.` : 'Double-check your order — untick anything you don’t want before checkout.'}</div>
          {fullCart.map((it,i) => { const on = confirmed.has(i); return (
            <div key={i} style={{display:'flex', alignItems:'center', gap:10, padding:'8px 0', borderBottom:i<fullCart.length-1?'0.5px solid var(--rule)':'none', opacity:on?1:0.45}}>
              <button onClick={()=>toggleItem(i)} aria-pressed={on} aria-label={(on?'Remove ':'Include ')+it.name} style={{width:24, height:24, borderRadius:7, flexShrink:0, border:on?'none':'1.6px solid var(--rule)', background:on?'var(--green-deep)':'transparent', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', padding:0}}>{on && <Icon.Check size={13} c="white"/>}</button>
              <div className={`ev-badge ${GRADE[it.tier]||'c'}`}>{GRADE_LETTER[it.tier]||'·'}</div>
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontSize:14, fontWeight:600, color:'var(--ink)', textDecoration:on?'none':'line-through'}}>{it.name}</div>
                <div style={{fontSize:12, color:'var(--ink-3)'}}>{it.dose || ''}</div>
              </div>
              <div className="mono" style={{fontSize:13, color:on?'var(--ink-2)':'var(--ink-4)'}}>{money(fakePrice(it.name))}</div>
            </div>
          ); })}
          <div style={{marginTop:10, fontSize:13, color:'var(--ink-2)'}}>
            <div style={{display:'flex', justifyContent:'space-between', padding:'2px 0'}}><span>Subtotal · {cart.length} item{cart.length===1?'':'s'}</span><span className="mono">{money(subtotal)}</span></div>
            <div style={{display:'flex', justifyContent:'space-between', padding:'2px 0'}}><span>Shipping</span><span className="mono">{money(shipping)}</span></div>
            <div style={{display:'flex', justifyContent:'space-between', padding:'6px 0 0', fontWeight:700, color:'var(--ink)'}}><span>Total</span><span className="mono">{money(total)}</span></div>
          </div>
          <button disabled={cart.length===0} onClick={()=>setStage('details')} style={{width:'100%', marginTop:14, padding:'12px', borderRadius:12, border:'none', background:cart.length?'var(--brand)':'var(--surface-3)', color:cart.length?'white':'var(--ink-4)', fontSize:14, fontWeight:600, cursor:cart.length?'pointer':'default'}}>{cart.length ? `Continue to checkout · ${cart.length} item${cart.length>1?'s':''}` : 'Select at least one supplement'}</button>
        </OrderCard>
      );

      if (stage === 'details') {
        const f = (label,key,props={}) => (
          <div style={{marginBottom:8}}>
            <div style={{fontSize:10, color:'var(--ink-3)', fontWeight:600, letterSpacing:'.05em', textTransform:'uppercase', marginBottom:3}}>{label}</div>
            <input value={addr[key]||''} onChange={e=>set(key,e.target.value)} {...props} style={{width:'100%', padding:'9px 11px', border:'1px solid var(--rule)', borderRadius:9, fontSize:14, fontFamily:'inherit', outline:'none'}}/>
          </div>
        );
        return (
          <OrderCard>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
              <div>{f('First name','firstName')}</div><div>{f('Last name','lastName')}</div>
            </div>
            {f('Address','addressLine1')}
            <div style={{display:'grid', gridTemplateColumns:'2fr 1fr 1fr', gap:8}}>
              <div>{f('City','city')}</div>
              <div>
                <div style={{fontSize:10, color:'var(--ink-3)', fontWeight:600, letterSpacing:'.05em', textTransform:'uppercase', marginBottom:3}}>State</div>
                <select value={addr.province} onChange={e=>set('province', e.target.value)} style={{width:'100%', padding:'9px 7px', border:'1px solid var(--rule)', borderRadius:9, fontSize:14, fontFamily:'inherit', background:'white'}}>{US_STATES.map(s=><option key={s} value={s}>{s}</option>)}</select>
              </div>
              <div>{f('ZIP','postalCode',{inputMode:'numeric'})}</div>
            </div>
            <div style={{marginTop:8, padding:'10px 12px', background:'var(--surface-2)', borderRadius:10}}>
              <div style={{fontSize:10, letterSpacing:'.08em', textTransform:'uppercase', color:'var(--brand)', fontWeight:600}}>Payment · sandbox card</div>
              <div className="mono" style={{fontSize:13, color:'var(--ink-2)', marginTop:3}}>4242 4242 4242 4242 · 12/34 · 444</div>
            </div>
            <button disabled={!detailsValid} onClick={()=>setStage('processing')} style={{width:'100%', marginTop:12, padding:'12px', borderRadius:12, border:'none', background:detailsValid?'var(--accent)':'var(--surface-3)', color:detailsValid?'white':'var(--ink-4)', fontSize:14, fontWeight:600}}>Place order · {money(total)}</button>
          </OrderCard>
        );
      }

      if (stage === 'processing') return (
        <OrderCard>
          {ORDER_STEPS.map((st,i) => {
            const done = i < stepIdx, active = i === stepIdx;
            if (i > stepIdx) return null;
            return (
              <div key={i} style={{display:'flex', alignItems:'center', gap:10, padding:'7px 0', opacity: done?0.65:1}}>
                <div style={{width:22, height:22, borderRadius:'50%', background:done?'var(--brand)':'var(--brand-soft)', display:'flex', alignItems:'center', justifyContent:'center'}}>
                  {done ? <Icon.Check size={12} c="white"/> : <div className="typing" style={{transform:'scale(0.7)'}}><span></span><span></span><span></span></div>}
                </div>
                <div style={{fontSize:14, color:done?'var(--ink-3)':'var(--ink)', fontWeight:active?600:400}}>{st.label}</div>
                <div className="mono" style={{marginLeft:'auto', fontSize:9, color:'var(--ink-4)'}}>{st.s}</div>
              </div>
            );
          })}
        </OrderCard>
      );

      // done
      return (
        <OrderCard>
          <div style={{textAlign:'center', padding:'4px 0 10px'}}>
            <div style={{width:48, height:48, borderRadius:'50%', background:'var(--brand)', display:'inline-flex', alignItems:'center', justifyContent:'center', marginBottom:10}}><Icon.Check size={24} c="white"/></div>
            <div className="serif" style={{fontSize:22, color:'var(--ink)'}}>Order placed</div>
            <div style={{fontSize:13, color:'var(--ink-3)', marginTop:2}}>Confirmation <span className="mono" style={{color:'var(--brand)'}}>{order.num}</span></div>
          </div>
          <div style={{borderTop:'0.5px solid var(--rule)', paddingTop:10, fontSize:13, color:'var(--ink-2)'}}>
            <div style={{display:'flex', justifyContent:'space-between', padding:'2px 0'}}><span>{order.items} item{order.items>1?'s':''}</span><span className="mono">{money(order.total)}</span></div>
            <div style={{display:'flex', justifyContent:'space-between', padding:'2px 0'}}><span>Est. delivery</span><span>{order.eta}</span></div>
          </div>
          <div style={{marginTop:12, fontSize:11, color:'var(--ink-3)', lineHeight:1.5, textAlign:'center'}}>Simulated CartAI order — no real money or product. Swap in your live CartAI key to make it real.</div>
        </OrderCard>
      );
    };

    const titleCase = (s) => s.replace(/\b\w/g, c => c.toUpperCase());
    // Detect purchase intent in a chat message and, when present, what to order.
    // Returns null (not an order), {whole:true} (order the whole stack), or
    // {item:"Saffron"} (order a specific named supplement).
    const parseOrderIntent = (text) => {
      const t = text.trim();
      if (/\b(check\s?out|place (an |my )?order|order my (stack|supps|supplements)|buy my (stack|supps|supplements))\b/i.test(t)) return { whole:true };
      // "order/buy/get/purchase [me] [some] X" — anchored at the start so genuine
      // questions ("what should I buy for sleep?") don't get hijacked.
      const m = t.match(/^(?:can you |could you |please |i(?:'| )?d like to |i want to |i wanna )?(?:order|buy|purchase|get)\s+(?:me\s+)?(?:some\s+)?(.+)$/i);
      if (!m) return null;
      const item = m[1].trim().replace(/[.?!,]+$/,'').replace(/\s+for me$/i,'').replace(/\s+(right\s+)?now$/i,'').replace(/\s+please$/i,'').trim();
      if (!item || /^(my )?(stack|supps|supplements|these|them|it|now|please)$/i.test(item)) return { whole:true };
      return { whole:false, item };
    };

    // Supplements detected in an answer, rendered as a build-your-order list.
    // Each row has a "+" to add it to the order; the order button at the bottom
    // is grey/disabled until at least one is selected, then turns green.
    // Module-scope so its selection state survives Ask re-renders.
    const AnswerSupps = ({ supps, answer, onOrder }) => {
      const { Icon } = window;
      const [sel, setSel] = useState(() => new Set());
      const toggle = (id) => setSel(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
      const count = sel.size;
      const order = () => onOrder(supps.filter(s => sel.has(s.id)).map(s => ({ name:s.n, tier:'Secondary', dose:'', iherb_url:suppIherbUrl(s) })), answer);
      return (
        <div style={{marginLeft:34, marginTop:12}}>
          <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:8}}>
            <CartIcon size={13} c="var(--brand)"/>
            <span style={{fontSize:11, letterSpacing:'.08em', textTransform:'uppercase', color:'var(--ink-3)', fontWeight:600}}>Build your order</span>
          </div>
          <div className="bal-card" style={{padding:'2px 0', border:'1px solid var(--rule)'}}>
            {supps.map((s,i) => { const on = sel.has(s.id); return (
              <div key={s.id} style={{display:'flex', alignItems:'center', gap:10, padding:'10px 14px', borderBottom:i<supps.length-1?'0.5px solid var(--rule)':'none'}}>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{fontSize:14, fontWeight:600, color:'var(--ink)'}}>{s.n}</div>
                  <div style={{display:'flex', flexWrap:'wrap', gap:6, marginTop:3}}>
                    {buyLinksFor(s).map(r => (
                      <a key={r.key} href={r.url} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex', alignItems:'center', gap:3, fontSize:11, color:'var(--brand)', fontWeight:500, textDecoration:'none'}}>{r.name} <ExternalIcon size={9} c="var(--brand)"/></a>
                    ))}
                  </div>
                </div>
                <button onClick={()=>toggle(s.id)} aria-pressed={on} aria-label={(on?'Remove ':'Add ')+s.n} style={{width:32, height:32, borderRadius:'50%', border:'none', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', background:on?'var(--green-deep)':'var(--brand-soft)', cursor:'pointer', transition:'background 150ms'}}>
                  {on ? <Icon.Check size={15} c="white"/> : <Icon.Plus size={16} c="var(--brand)"/>}
                </button>
              </div>
            ); })}
          </div>
          <button disabled={count===0} onClick={order} style={{width:'100%', marginTop:10, padding:'13px', borderRadius:14, border:'none', fontSize:15, fontWeight:600, display:'flex', alignItems:'center', justifyContent:'center', gap:8, background:count?'var(--green-deep)':'var(--surface-3)', color:count?'white':'var(--ink-4)', boxShadow:count?'0 6px 16px rgba(19,160,92,0.28)':'none', cursor:count?'pointer':'default', transition:'background 150ms, box-shadow 150ms'}}>
            <CartIcon size={16} c={count?'white':'var(--ink-4)'}/>
            {count ? `Order ${count} supplement${count>1?'s':''}` : 'Select supplements to order'}
          </button>
        </div>
      );
    };

    const Ask = ({ stack, onAdd, inStack, onNav, initialQuery }) => {
      const { Icon } = window;
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [busy, setBusy] = useState(false);
      const scrollRef = useRef(null);
      const didInit = useRef(false);
      useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, busy]);

      // Drop the simulated CartAI order card into the conversation. `cart` is the
      // resolved line-items; `itemName` (optional) is the single named supplement.
      const startOrder = (userText, cart, itemName) => {
        const resolved = (cart && cart.length) ? cart : (stack.length ? stack : SAMPLE_CART);
        setMessages(m => [
          ...m,
          ...(userText ? [{ role:'user', content:userText }] : []),
          { role:'assistant', content: itemName ? `On it — ordering ${itemName} via CartAI. 🛒` : "Let's get your stack ordered via CartAI. 🛒" },
          { role:'assistant', kind:'order', cart: resolved },
        ]);
      };

      // Order a specific set of selected supplements from an answer's order list.
      // `answer` is carried through so the order card can show the double-check.
      const orderItems = (items, answer) => {
        if (!items || !items.length) return;
        setMessages(m => [
          ...m,
          { role:'assistant', content: `Review your order below — confirm the supplement${items.length>1?'s':''} you want, then check out. 🛒` },
          { role:'assistant', kind:'order', cart: items, answer },
        ]);
      };

      const send = async (q) => {
        const question = (q ?? input).trim();
        if (!question || busy) return;
        setInput('');
        // Purchase intent → run the in-chat (simulated) CartAI checkout, not the LLM.
        const intent = parseOrderIntent(question);
        if (intent) {
          if (intent.whole) { startOrder(question, null, null); return; }
          const name = titleCase(intent.item);
          const cart = [{ name, tier:'Secondary', dose:'', iherb_url:'https://www.iherb.com/search?kw=' + encodeURIComponent(intent.item) }];
          startOrder(question, cart, name);
          return;
        }
        const next = [...messages, { role:'user', content:question }];
        setMessages(next);
        setBusy(true);
        const payload = { messages: next.map(m => ({ role:m.role, content:m.content })), stack: stack.map(s => s.name) };
        try {
          const res = await fetch('/api/chat/stream', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
          if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
          const reader = res.body.getReader();
          const dec = new TextDecoder();
          let buf = '', acc = '', sources = [];
          setMessages(m => [...m, { role:'assistant', content:'' }]);
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream:true });
            const events = buf.split('\n\n'); buf = events.pop();
            for (const ev of events) {
              const line = ev.split('\n').find(l => l.startsWith('data:'));
              if (!line) continue;
              try {
                const j = JSON.parse(line.slice(5).trim());
                if (j.text) { acc += j.text; setMessages(m => { const c=[...m]; c[c.length-1]={role:'assistant', content:acc, sources}; return c; }); }
                if (j.sources) { sources = j.sources; setMessages(m => { const c=[...m]; c[c.length-1]={role:'assistant', content:acc, sources}; return c; }); }
              } catch {}
            }
          }
        } catch (err) {
          setMessages(m => [...m, { role:'assistant', content:'⚠️ The assistant is temporarily unavailable — please try again in a moment.' }]);
        } finally { setBusy(false); }

    // ============ Checkout (CartAI integration, TEST MODE) ============
    // Renders as a full-screen drawer over the Stack screen. Collects a
    // shipping address, then POSTs the stack to /api/checkout. CartAI returns
    // a taskId; we poll /api/checkout/{taskId} every 4s until terminal.
    const US_STATES = ['AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'];
    const blankAddress = () => ({
      firstName:'', lastName:'', email:'', phone:'',
      addressLine1:'', addressLine2:'', city:'', province:'NY', postalCode:''
    });
    const TERMINAL = ['SUCCEEDED','SUCCESS','COMPLETED','FAILED','CANCELED','CANCELLED','ERROR'];

    const Checkout = ({ stack, onClose }) => {
      const { Icon } = window;
      const [addr, setAddr] = useState(() => ({ ...blankAddress(), ...LS.get('bal_addr', {}) }));
      const [items, setItems] = useState(() => stack.map(s => ({ name: s.name, url: buyLinksForName(s.name, s.iherb_url)[0].url, quantity: 1 })));
      const [submitting, setSubmitting] = useState(false);
      const [error, setError] = useState(null);
      const [task, setTask] = useState(null);          // {taskId, ...}
      const [status, setStatus] = useState(null);      // last poll response
      const [pollErr, setPollErr] = useState(null);

      useEffect(() => { LS.set('bal_addr', addr); }, [addr]);
      const set = (k, v) => setAddr(a => ({ ...a, [k]: v }));
      const setItem = (i, k, v) => setItems(prev => prev.map((it, j) => j===i ? { ...it, [k]: v } : it));
      const removeItem = (i) => setItems(prev => prev.filter((_, j) => j !== i));

      const valid = useMemo(() => {
        const reqd = ['firstName','lastName','email','phone','addressLine1','city','province','postalCode'];
        return reqd.every(k => (addr[k]||'').trim().length) && /.+@.+\..+/.test(addr.email) && items.length>0 && items.every(it => it.url.trim());
      }, [addr, items]);

      const submit = async () => {
        if (!valid || submitting) return;
        setSubmitting(true); setError(null);
        try {
          const body = {
            contact: { firstName: addr.firstName, lastName: addr.lastName, email: addr.email, phone: addr.phone },
            address: { addressLine1: addr.addressLine1, addressLine2: addr.addressLine2, city: addr.city, province: addr.province, postalCode: addr.postalCode },
            items: items.map(it => ({ url: it.url, quantity: it.quantity || 1 })),
          };
          const res = await fetch('/api/checkout', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(typeof data.detail==='string' ? data.detail : (res.status===503 ? 'Checkout not configured. Add CARTAI_API_KEY to the Render dashboard.' : `HTTP ${res.status}`));
          setTask(data);
        } catch (e) {
          setError(String(e.message || e));
        } finally {
          setSubmitting(false);
        }
      };

      // Poll status every 4s until a terminal state.
      useEffect(() => {
        if (!task?.taskId) return;
        let stop = false, timer = null;
        const poll = async () => {
          try {
            const r = await fetch('/api/checkout/' + encodeURIComponent(task.taskId));
            const j = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(j.detail || ('HTTP ' + r.status));
            if (stop) return;
            setStatus(j); setPollErr(null);
            const s = String(j.status || j.state || j.currentStatus || '').toUpperCase();
            if (!TERMINAL.includes(s)) timer = setTimeout(poll, 4000);
          } catch (e) {
            if (!stop) { setPollErr(String(e.message || e)); timer = setTimeout(poll, 6000); }
          }
        };
        poll();
        return () => { stop = true; if (timer) clearTimeout(timer); };
      }, [task]);

      const currentStatus = status && (status.status || status.state || status.currentStatus);
      const terminal = currentStatus && TERMINAL.includes(String(currentStatus).toUpperCase());

      // ---------- post-submit status view ----------
      if (task) return (
        <div className="screen-root">
          <div className="scroll" style={{height:'100%', paddingBottom:120}}>
            <div style={{height:54}}/>
            <div style={{padding:'8px 18px', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
              <button onClick={onClose} style={{width:36, height:36, borderRadius:'50%', background:'var(--surface)', boxShadow:'var(--sh-1)', border:'none', display:'flex', alignItems:'center', justifyContent:'center'}}><Icon.Back size={16} c="var(--ink-2)"/></button>
              <div style={{fontSize:13, color:'var(--ink-3)', fontWeight:500}}>Test checkout</div>
              <div style={{width:36}}/>
            </div>
            <div style={{padding:'24px 22px'}}>
              <div className="bal-pill accent" style={{padding:'5px 10px'}}>TEST MODE · NO REAL MONEY</div>
              <div className="serif" style={{fontSize:30, lineHeight:1.1, marginTop:12, color:'var(--ink)'}}>
                Your order is <em style={{color:'var(--brand)'}}>{terminal ? (String(currentStatus).toUpperCase().includes('FAIL') || String(currentStatus).toUpperCase().includes('ERROR') || String(currentStatus).toUpperCase().includes('CANCEL') ? 'failed' : 'placed') : 'in progress'}</em>.
              </div>
              <div style={{fontSize:13, color:'var(--ink-3)', marginTop:8}}>Task id <span className="mono">{task.taskId}</span></div>
            </div>

            <div style={{padding:'4px 22px'}}>
              <div className="bal-card" style={{padding:'18px'}}>
                <div style={{display:'flex', alignItems:'center', gap:10}}>
                  {!terminal && <div className="typing"><span></span><span></span><span></span></div>}
                  <div style={{fontSize:15, fontWeight:600, color:'var(--ink)'}}>Status: {currentStatus || (pollErr ? 'unknown' : 'awaiting first update…')}</div>
                </div>
                {pollErr && <div style={{fontSize:12, color:'var(--accent)', marginTop:8}}>Polling error: {pollErr}</div>}
                {status && (
                  <pre className="mono" style={{marginTop:14, padding:12, background:'var(--surface-2)', borderRadius:10, fontSize:11, color:'var(--ink-2)', overflowX:'auto', whiteSpace:'pre-wrap', wordBreak:'break-word', maxHeight:280}}>{JSON.stringify(status, null, 2)}</pre>
                )}
              </div>
              <div style={{fontSize:11, color:'var(--ink-3)', textAlign:'center', padding:'18px 8px', lineHeight:1.5}}>
                Checkout is fulfilled by CartAI's AI agent. In test mode the order is simulated and no money or product moves.
              </div>
            </div>
          </div>
        </div>
      );

      // ---------- form view ----------
      const field = (label, key, props={}) => (
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11, color:'var(--ink-3)', fontWeight:600, letterSpacing:'.06em', textTransform:'uppercase', marginBottom:4}}>{label}</div>
          <input value={addr[key]||''} onChange={e=>set(key, e.target.value)} {...props}
            style={{width:'100%', padding:'12px 14px', border:'1px solid var(--rule)', borderRadius:12, fontSize:15, fontFamily:'inherit', outline:'none', background:'var(--surface)'}}/>
        </div>
      );

      return (
        <div className="screen-root">
          <div className="scroll" style={{height:'100%', paddingBottom:120}}>
            <div style={{height:54}}/>
            <div style={{padding:'8px 18px', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
              <button onClick={onClose} style={{width:36, height:36, borderRadius:'50%', background:'var(--surface)', boxShadow:'var(--sh-1)', border:'none', display:'flex', alignItems:'center', justifyContent:'center'}}><Icon.Back size={16} c="var(--ink-2)"/></button>
              <div style={{fontSize:13, color:'var(--ink-3)', fontWeight:500}}>Test checkout</div>
              <div style={{width:36}}/>
            </div>
            <div style={{padding:'8px 22px 4px'}}>
              <div className="bal-pill accent" style={{padding:'5px 10px'}}>TEST MODE</div>
              <div className="serif" style={{fontSize:32, lineHeight:1.1, marginTop:12, color:'var(--ink)'}}>Buy my <em style={{color:'var(--brand)'}}>stack</em>.</div>
              <div style={{fontSize:13, color:'var(--ink-3)', marginTop:8, lineHeight:1.5}}>
                CartAI's agent will attempt to complete the checkout. Sandbox card is pre-filled; no real money moves.
              </div>
            </div>

            {/* Items */}
            <div style={{padding:'16px 18px 0'}}>
              <div style={{fontSize:11, letterSpacing:'.1em', textTransform:'uppercase', color:'var(--ink-3)', fontWeight:600, marginBottom:8}}>{items.length} item{items.length!==1?'s':''}</div>
              {items.length===0 && <div style={{fontSize:13, color:'var(--accent)', padding:'8px 0'}}>Your stack is empty — add a supplement first.</div>}
              {items.map((it, i) => (
                <div key={i} className="bal-card" style={{padding:'12px 14px', marginBottom:8}}>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', gap:8}}>
                    <div style={{fontSize:14, fontWeight:600, color:'var(--ink)', flex:1}}>{it.name}</div>
                    <button onClick={()=>removeItem(i)} style={{background:'none', border:'none', color:'var(--ink-4)', fontSize:18, padding:'0 4px'}}>×</button>
                  </div>
                  <input value={it.url} onChange={e=>setItem(i,'url', e.target.value)} placeholder="Product URL"
                    style={{width:'100%', marginTop:6, padding:'8px 10px', border:'1px solid var(--rule)', borderRadius:8, fontSize:12, fontFamily:'JetBrains Mono, monospace', outline:'none'}}/>
                  <div style={{fontSize:11, color:'var(--ink-3)', marginTop:6, lineHeight:1.4}}>
                    Pre-filled with the iHerb search URL. For best results paste an exact product page URL (CartAI needs to land on a product, not a list).
                  </div>
                </div>
              ))}
            </div>

            {/* Shipping */}
            <div style={{padding:'18px 18px 0'}}>
              <div className="serif" style={{fontSize:20, color:'var(--ink)', marginBottom:10}}>Shipping</div>
              <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
                <div>{field('First name','firstName',{autoComplete:'given-name'})}</div>
                <div>{field('Last name','lastName',{autoComplete:'family-name'})}</div>
              </div>
              {field('Email','email',{type:'email', autoComplete:'email'})}
              {field('Phone','phone',{type:'tel', autoComplete:'tel', placeholder:'5555555555'})}
              {field('Address line 1','addressLine1',{autoComplete:'address-line1'})}
              {field('Address line 2 (optional)','addressLine2',{autoComplete:'address-line2'})}
              <div style={{display:'grid', gridTemplateColumns:'2fr 1fr 1fr', gap:10}}>
                <div>{field('City','city',{autoComplete:'address-level2'})}</div>
                <div>
                  <div style={{fontSize:11, color:'var(--ink-3)', fontWeight:600, letterSpacing:'.06em', textTransform:'uppercase', marginBottom:4}}>State</div>
                  <select value={addr.province} onChange={e=>set('province', e.target.value)}
                    style={{width:'100%', padding:'12px 10px', border:'1px solid var(--rule)', borderRadius:12, fontSize:15, fontFamily:'inherit', background:'var(--surface)'}}>
                    {US_STATES.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
                <div>{field('ZIP','postalCode',{autoComplete:'postal-code', inputMode:'numeric'})}</div>
              </div>
            </div>

            {/* Payment (sandbox info) */}
            <div style={{padding:'18px 18px 0'}}>
              <div className="serif" style={{fontSize:20, color:'var(--ink)', marginBottom:10}}>Payment</div>
              <div className="bal-card" style={{padding:'14px 16px', background:'var(--surface-2)'}}>
                <div style={{fontSize:11, letterSpacing:'.1em', textTransform:'uppercase', color:'var(--brand)', fontWeight:600}}>Sandbox card · pre-filled</div>
                <div className="mono" style={{fontSize:14, color:'var(--ink-2)', marginTop:6}}>4242 4242 4242 4242 · 12/2034 · 444</div>
                <div style={{fontSize:12, color:'var(--ink-3)', marginTop:6, lineHeight:1.5}}>Real-card checkout is intentionally out of scope. It would put us in PCI-DSS scope, which needs a separate plan.</div>
              </div>
            </div>

            {error && <div style={{margin:'14px 18px 0', padding:'12px 14px', background:'var(--accent-soft)', color:'var(--brand-deep)', borderRadius:12, fontSize:13}}>{error}</div>}

            <div style={{padding:'20px 18px 0'}}>
              <button disabled={!valid || submitting} onClick={submit}
                style={{width:'100%', padding:'14px 20px', borderRadius:16, border:'none', background:(!valid||submitting)?'var(--surface-3)':'var(--brand)', color:(!valid||submitting)?'var(--ink-4)':'white', fontSize:15, fontWeight:600, boxShadow:(!valid||submitting)?'none':'0 8px 22px rgba(85,33,229,0.26)'}}>
                {submitting ? 'Submitting to CartAI…' : 'Place test order'}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ============ Stack ============
    const Stack = ({ stack, onRemove, onCheckout, checkoutEnabled, onNav }) => {
      const { Icon, Tabbar } = window;
      const groups = useMemo(() => { const g={}; stack.forEach(s => { const k = s.sourceTitle || 'My supplements'; (g[k]=g[k]||[]).push(s); }); return g; }, [stack]);
      const goalCount = Object.keys(groups).length;
      return (
        <div className="screen-root">
          <div className="scroll" style={{height:'100%', paddingBottom:120}}>
            <div style={{height:54}}/>
            <div style={{padding:'8px 22px'}}>
              <div className="serif" style={{fontSize:34, lineHeight:1, color:'var(--ink)'}}>My stack</div>
              <div style={{fontSize:13, color:'var(--ink-3)', marginTop:4}}>{stack.length} supplement{stack.length!==1?'s':''} · {goalCount} goal{goalCount!==1?'s':''}</div>
            </div>

            {stack.length===0 ? (
              <div style={{padding:'22px'}}>
                <div className="bal-card" style={{padding:24, textAlign:'center'}}>
                  <div style={{display:'flex', justifyContent:'center', marginBottom:14}}><Icon.Stack size={40} c="var(--brand-soft)"/></div>
                  <div className="serif" style={{fontSize:20, color:'var(--ink)'}}>Your stack is empty</div>
                  <div style={{fontSize:13, color:'var(--ink-3)', marginTop:6, lineHeight:1.5}}>Open a guide, get your AI-built recommendations, and tap “Add to stack”.</div>
                  <button onClick={()=>onNav('browse')} style={{marginTop:16, padding:'12px 20px', background:'var(--brand)', color:'white', border:'none', borderRadius:14, fontSize:14, fontWeight:600}}>Browse guides</button>
                </div>
              </div>
            ) : (
              <div style={{padding:'14px 18px 0'}}>
                <div className="bal-card" style={{padding:18, marginBottom:12, background:'var(--brand-soft)', boxShadow:'none', border:'1px solid #d6cffa'}}>
                  <div style={{fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--brand)', fontWeight:600}}>Stack health</div>
                  <div className="serif" style={{fontSize:30, color:'var(--brand-deep)', marginTop:4}}>{stack.length} active</div>
                  <div style={{fontSize:13, color:'var(--brand-deep)', opacity:0.8, marginTop:2}}>across {goalCount} goal{goalCount!==1?'s':''}</div>
                </div>
                <button onClick={onCheckout} disabled={!checkoutEnabled}
                  title={checkoutEnabled ? '' : 'Checkout is unavailable — CARTAI_API_KEY is not set on the server.'}
                  style={{width:'100%', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'14px 18px', borderRadius:16, marginBottom:16, border:'none', background: checkoutEnabled ? 'var(--accent)' : 'var(--surface-3)', color: checkoutEnabled ? 'white' : 'var(--ink-4)', boxShadow: checkoutEnabled ? '0 8px 22px rgba(233,120,218,0.32)' : 'none'}}>
                  <span style={{textAlign:'left'}}>
                    <span style={{fontSize:11, letterSpacing:'.12em', textTransform:'uppercase', opacity:0.85, display:'block'}}>{checkoutEnabled ? 'Test checkout · CartAI' : 'Checkout unavailable'}</span>
                    <span className="serif" style={{fontSize:20, display:'block', marginTop:2}}>Buy my stack</span>
                  </span>
                  {checkoutEnabled && <Icon.Chevron size={16} c="white"/>}
                </button>
                {Object.entries(groups).map(([title, items]) => (
                  <div key={title} className="bal-card" style={{padding:'4px 0', marginBottom:14}}>
                    <div style={{padding:'12px 16px 8px', display:'flex', justifyContent:'space-between', alignItems:'center', borderBottom:'0.5px solid var(--rule)'}}>
                      <div className="serif" style={{fontSize:18, color:'var(--ink)'}}>{title}</div>
                      <div style={{fontSize:12, color:'var(--ink-3)'}}>{items.length} supp{items.length>1?'s':''}</div>
                    </div>
                    {items.map((s,i) => (
                      <div key={i} style={{display:'flex', alignItems:'center', padding:'12px 16px', borderBottom:i<items.length-1?'0.5px solid var(--rule)':'none'}}>
                        <div className={`ev-badge ${GRADE[s.tier]||'c'}`} style={{marginRight:12}}>{GRADE_LETTER[s.tier]||'·'}</div>
                        <div style={{flex:1}}>
                          <div style={{fontSize:14, fontWeight:600, color:'var(--ink)'}}>{s.name}</div>
                          <div style={{fontSize:12, color:'var(--ink-3)', marginTop:1}}>{[s.dose, s.timing].filter(Boolean).join(' · ')}</div>
                        </div>
                        {(() => { const r = buyLinksForName(s.name, s.iherb_url)[0]; return (
                          <a href={r.url} target="_blank" rel="noopener noreferrer" style={{marginRight:6, padding:'6px 10px', background:'var(--surface-3)', color:'var(--ink-2)', borderRadius:999, textDecoration:'none', fontSize:12, fontWeight:600, display:'inline-flex', alignItems:'center', gap:4}}>{r.name}<ExternalIcon size={11} c="var(--ink-2)"/></a>
                        ); })()}
                        <button onClick={()=>onRemove(s.name)} style={{width:28, height:28, borderRadius:'50%', background:'var(--surface-3)', border:'none', display:'flex', alignItems:'center', justifyContent:'center', color:'var(--ink-3)', fontSize:16, lineHeight:1}}>×</button>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            )}
          </div>
          <Tabbar active="stack" onNav={onNav}/>
        </div>
      );
    };

    // ============ Profile (Me) ============
    const Profile = ({ goals, stack, onReset, onNav }) => {
      const { Icon, Tabbar } = window;
      const goalTopics = goals.map(s => TOPIC_BY_SLUG[s]).filter(Boolean);
      return (
        <div className="screen-root">
          <div className="scroll" style={{height:'100%', paddingBottom:120}}>
            <div style={{height:54}}/>
            <div style={{padding:'8px 22px 0'}}><window.BalLogo size={24} variant="full"/></div>
            <div style={{padding:'22px 18px 0'}}>
              <div className="bal-card" style={{padding:20, display:'flex', alignItems:'center', gap:14}}>
                <div style={{width:56, height:56, borderRadius:'50%', background:GRAD, display:'flex', alignItems:'center', justifyContent:'center', color:'white', fontWeight:700, fontSize:22}} className="serif">Y</div>
                <div>
                  <div className="serif" style={{fontSize:22, color:'var(--ink)'}}>You</div>
                  <div style={{fontSize:13, color:'var(--ink-3)', marginTop:2}}>{stack.length} in stack · {goalTopics.length} goals</div>
                </div>
              </div>
            </div>
            <div style={{padding:'22px 18px 0'}}>
              <div style={{fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--ink-3)', fontWeight:600, marginBottom:10}}>Your goals</div>
              <div style={{display:'flex', flexWrap:'wrap', gap:8}}>
                {goalTopics.length ? goalTopics.map(t => <span key={t.slug} className="bal-pill" style={{padding:'8px 12px'}}>{t.name}</span>) : <div style={{fontSize:13, color:'var(--ink-3)'}}>No goals selected yet.</div>}
                <button onClick={()=>onNav('intake')} className="bal-pill light" style={{padding:'8px 12px', border:'none'}}>Edit goals</button>
              </div>
            </div>
            <div style={{padding:'24px 18px 0'}}>
              <div style={{fontSize:11, letterSpacing:'0.1em', textTransform:'uppercase', color:'var(--ink-3)', fontWeight:600, marginBottom:10}}>App</div>
              <div className="bal-card" style={{padding:'4px 0'}}>
                <button onClick={()=>onNav('ask')} style={{width:'100%', textAlign:'left', display:'flex', alignItems:'center', gap:12, padding:'14px 16px', borderBottom:'0.5px solid var(--rule)', background:'none', border:'none', color:'var(--ink)'}}><Icon.Spark size={18} c="var(--brand)"/><span style={{fontSize:14, fontWeight:500}}>Open chat</span></button>
                <button onClick={onReset} style={{width:'100%', textAlign:'left', display:'flex', alignItems:'center', gap:12, padding:'14px 16px', background:'none', border:'none', color:'var(--accent)'}}><span style={{fontSize:14, fontWeight:500}}>Reset app & data</span></button>
              </div>
            </div>
            <div style={{padding:'24px 22px', fontSize:11, color:'var(--ink-3)', textAlign:'center', lineHeight:1.5}}>Not medical advice. For personal health decisions, consult a qualified healthcare professional.</div>
          </div>
          <Tabbar active="me" onNav={onNav}/>
        </div>
      );
    };

    // ============ Root ============
    const Root = () => {
      const [onboarded, setOnboarded] = useState(() => LS.get('bal_onboarded', false));
      const [goals, setGoals] = useState(() => LS.get('bal_goals', []));
      const [stack, setStack] = useState(() => LS.get('bal_stack', []));
      const [taken, setTaken] = useState(() => LS.get('bal_taken', []));
      // New users land on the welcome screen first; returning (onboarded) users
      // open straight into the app (Today/Home). Goal personalization also stays
      // reachable later via Profile → Edit goals.
      const [flow, setFlow] = useState(() => LS.get('bal_onboarded', false) ? 'app' : 'onboard');
      const [screen, setScreen] = useState('home');
      const [slug, setSlug] = useState('memory-focus');
      const [askQuery, setAskQuery] = useState(null);  // seeds a quick search into Ask
      const [cache, setCache] = useState({});
      const [checkoutOpen, setCheckoutOpen] = useState(false);
      const [checkoutEnabled, setCheckoutEnabled] = useState(false);

      // Probe whether the server has CARTAI_API_KEY set — drives the Buy
      // button's enabled/disabled state on Stack.
      useEffect(() => {
        fetch('/api/checkout/config')
          .then(r => r.ok ? r.json() : null)
          .then(j => { if (j && typeof j.enabled === 'boolean') setCheckoutEnabled(j.enabled); })
          .catch(() => {});
      }, []);

      useEffect(()=>LS.set('bal_goals', goals), [goals]);
      useEffect(()=>LS.set('bal_stack', stack), [stack]);
      useEffect(()=>LS.set('bal_taken', taken), [taken]);
      useEffect(()=>LS.set('bal_onboarded', onboarded), [onboarded]);

      const navTo = useCallback((k) => {
        const map = { home:'home', ask:'ask', stack:'stack', browse:'learn', me:'profile' };
        if (k==='intake') { setFlow('intake'); return; }
        if (k==='ask') setAskQuery(null);  // opening Ask plainly = empty chat
        setScreen(map[k] || 'home');
      }, []);
      // Quick-search: jump into Ask and auto-run a question (from a Home chip).
      const askSearch = useCallback((q) => { setAskQuery(q); setScreen('ask'); }, []);
      const openCategory = useCallback((s) => { setSlug(s); setScreen('category'); }, []);
      const addToStack = useCallback((s, sourceTitle) => { setStack(prev => prev.some(x => x.name===s.name) ? prev : [...prev, { ...s, sourceTitle }]); }, []);
      const removeFromStack = useCallback((name) => setStack(prev => prev.filter(x => x.name!==name)), []);
      const inStack = useCallback((name) => stack.some(x => x.name===name), [stack]);
      const toggleTaken = useCallback((name) => setTaken(prev => prev.includes(name) ? prev.filter(n=>n!==name) : [...prev, name]), []);
      const resetAll = () => {
        ['bal_onboarded','bal_goals','bal_stack','bal_taken'].forEach(k => { try { localStorage.removeItem(k); } catch {} });
        setOnboarded(false); setGoals([]); setStack([]); setTaken([]); setFlow('onboard'); setScreen('home');
      };

      useEffect(() => {
        if (screen !== 'category') return;
        if (cache[slug]?.data || cache[slug]?.loading) return;
        setCache(c => ({ ...c, [slug]: { loading:true } }));
        fetch('/api/category/' + slug)
          .then(async r => { if (!r.ok) { let m='HTTP '+r.status; try { const j=await r.json(); m=j.detail||m; } catch {} throw new Error(m); } return r.json(); })
          .then(data => setCache(c => ({ ...c, [slug]: { data } })))
          .catch(err => setCache(c => ({ ...c, [slug]: { error:String(err.message||err) } })));
      }, [screen, slug]);

      if (flow === 'onboard') return <Onboarding onStart={()=>setFlow('intake')}/>;
      if (flow === 'intake') return <Intake initial={goals} onDone={(g)=>{ setGoals(g); setOnboarded(true); setFlow('app'); setScreen('home'); }}/>;

      if (screen === 'home')    return <Home goals={goals} stack={stack} taken={taken} onToggleTaken={toggleTaken} onOpenCategory={openCategory} onAsk={askSearch} onNav={navTo}/>;
      if (screen === 'ask')     return <Ask stack={stack} onAdd={addToStack} inStack={inStack} onNav={navTo} initialQuery={askQuery}/>;
      if (screen === 'learn')   return <Learn onOpen={openCategory} onNav={navTo}/>;
      if (screen === 'stack') {
        if (checkoutOpen) return <Checkout stack={stack} onClose={() => setCheckoutOpen(false)}/>;
        return <Stack stack={stack} onRemove={removeFromStack} onCheckout={() => setCheckoutOpen(true)} checkoutEnabled={checkoutEnabled} onNav={navTo}/>;
      }
      if (screen === 'profile') return <Profile goals={goals} stack={stack} onReset={resetAll} onNav={navTo}/>;
      if (screen === 'category') { const c = cache[slug] || {}; return <Category slug={slug} data={c.data} loading={c.loading} error={c.error} inStack={inStack} onAdd={addToStack} onBack={()=>setScreen('learn')} onNav={navTo}/>; }
      return <Home goals={goals} stack={stack} taken={taken} onToggleTaken={toggleTaken} onOpenCategory={openCategory} onNav={navTo}/>;
    };

    const REQUIRED = ['Icon','Tabbar','BalLogo','BalLogoMark'];
    const mount = () => {
      if (REQUIRED.some(n => !window[n])) return setTimeout(mount, 60);
      ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
    };
    mount();
  </script>
</body>
</html>

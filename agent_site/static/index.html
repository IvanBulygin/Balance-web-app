<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Balance — Wellbeing guides</title>
  <meta name="description" content="Evidence-based supplement guides with AI-built stacks." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Brand */
      --brand:       #5521E5;
      --brand-deep:  #20056C;
      --brand-soft:  #ECE5FC;
      --accent:      #E978DA;
      --accent-soft: #FDE2F8;
      /* Neutrals */
      --bg:        #FFFFFF;
      --surface:   #FFFFFF;
      --surface-2: #FAFAFA;
      --surface-3: #F0F0F3;
      --ink:       #050304;
      --ink-2:     #3D3D3D;
      --ink-3:     #7F7F7F;
      --ink-4:     #A6A6A6;
      --rule:      #E5E5E5;
      /* Shadows */
      --sh-1: 0 1px 2px rgba(32,5,108,0.05), 0 2px 8px rgba(32,5,108,0.05);
      --sh-2: 0 8px 24px rgba(32,5,108,0.08);
      --sh-card: 0 1px 0 rgba(32,5,108,0.03), 0 8px 28px rgba(32,5,108,0.06);
      /* Fonts */
      --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
      --sans:  'Inter', -apple-system, system-ui, sans-serif;
      --mono:  'JetBrains Mono', 'SF Mono', Menlo, monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(60% 35% at 12% 0%, rgba(86,182,198,0.06), transparent 60%),
        radial-gradient(50% 30% at 88% 100%, rgba(233,120,218,0.05), transparent 60%),
        var(--bg);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.01em;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    /* Mobile-first container, centered with a phone frame on desktop. */
    .app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (min-width: 540px) {
      body { background: #F4F4F7; }
      .app {
        margin-top: 24px;
        margin-bottom: 24px;
        background: var(--bg);
        border-radius: 28px;
        box-shadow: 0 20px 60px rgba(32,5,108,0.12);
        overflow: hidden;
        min-height: calc(100vh - 48px);
      }
    }

    /* Header / brand bar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 22px 8px;
    }
    .brand {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--brand-deep);
    }
    .brand em { font-style: italic; color: var(--brand); }
    .ask-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px;
      background: var(--brand-soft);
      color: var(--brand-deep);
      border-radius: 999px;
      font-size: 13px; font-weight: 600;
    }
    .ask-link svg { display: block; }

    /* Hero (Learn) */
    .hero {
      padding: 8px 22px 4px;
    }
    .hero h1 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 38px;
      line-height: 1.05;
      margin: 12px 0 6px;
      color: var(--ink);
    }
    .hero h1 em { font-style: italic; color: var(--brand); }
    .hero .sub { font-size: 14px; color: var(--ink-3); }

    /* Topic grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      padding: 18px 18px 24px;
    }
    .tile {
      aspect-ratio: 1 / 1;
      background: var(--surface);
      border-radius: 18px;
      box-shadow: var(--sh-1);
      padding: 14px;
      display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer;
      position: relative;
      transition: transform 160ms ease-out, box-shadow 160ms ease-out;
      border: 1px solid transparent;
    }
    .tile.live:hover, .tile.live:focus-visible {
      transform: translateY(-2px);
      box-shadow: var(--sh-card);
      border-color: var(--brand-soft);
    }
    .tile.coming { opacity: 0.55; cursor: not-allowed; }
    .tile .icon-wrap {
      width: 36px; height: 36px; border-radius: 12px;
      background: var(--brand-soft);
      color: var(--brand);
      display: flex; align-items: center; justify-content: center;
    }
    .tile.coming .icon-wrap { background: var(--surface-3); color: var(--ink-4); }
    .tile .name { font-size: 14px; font-weight: 600; line-height: 1.2; }
    .tile .meta {
      font-size: 11px; color: var(--ink-3); margin-top: 3px;
      font-family: var(--mono); letter-spacing: 0.04em;
    }
    .tile .badge {
      position: absolute; top: 10px; right: 10px;
      font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--ink-3); background: var(--surface-3);
      padding: 3px 6px; border-radius: 6px;
    }
    .tile.live .badge { background: var(--accent-soft); color: var(--brand); }

    /* Detail screen */
    .detail-hero {
      background: linear-gradient(160deg, var(--brand) 0%, var(--brand-deep) 100%);
      color: white;
      padding: 18px 22px 30px;
      position: relative;
      overflow: hidden;
    }
    .detail-hero::before,
    .detail-hero::after {
      content: ''; position: absolute; border-radius: 50%;
    }
    .detail-hero::before {
      top: -60px; right: -40px; width: 200px; height: 200px;
      background: rgba(243,169,253,0.10);
    }
    .detail-hero::after {
      bottom: -80px; left: -40px; width: 240px; height: 240px;
      background: rgba(86,182,198,0.08);
    }
    .detail-hero .row {
      display: flex; align-items: center; justify-content: space-between;
      position: relative; z-index: 1;
    }
    .iconbtn {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.14);
      display: inline-flex; align-items: center; justify-content: center;
      color: white;
    }
    .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent-soft);
      margin-top: 22px;
      position: relative; z-index: 1;
    }
    .detail-hero h1 {
      font-family: var(--serif);
      font-size: 40px; line-height: 1.06; font-weight: 600;
      margin: 8px 0 6px;
      position: relative; z-index: 1;
    }
    .detail-hero h1 em { font-style: italic; color: var(--accent-soft); }
    .detail-hero .tag {
      font-size: 14px; color: rgba(255,255,255,0.78);
      position: relative; z-index: 1;
      max-width: 90%;
    }

    .section { padding: 22px 22px 6px; }
    .section h2 {
      font-family: var(--serif);
      font-size: 22px; font-weight: 600;
      margin: 0 0 12px;
      color: var(--ink);
    }
    .section h2 em { font-style: italic; color: var(--brand); }
    .card {
      background: var(--surface);
      border-radius: 18px;
      box-shadow: var(--sh-card);
      padding: 4px 0;
    }
    .item {
      display: flex; gap: 14px; padding: 16px 18px;
      border-bottom: 1px solid var(--rule);
    }
    .item:last-child { border-bottom: none; }
    .item .marker {
      width: 26px; height: 26px; border-radius: 8px;
      background: var(--brand-soft); color: var(--brand);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 12px; font-weight: 600;
      flex-shrink: 0;
    }
    .item.lever .marker { background: var(--accent-soft); color: var(--brand); }
    .item .title { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
    .item .desc { font-size: 13px; color: var(--ink-2); line-height: 1.42; }

    /* Skeleton */
    .skeleton-line, .skeleton-block {
      background: linear-gradient(90deg, var(--surface-3) 0%, #E8E8EE 50%, var(--surface-3) 100%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: 6px;
    }
    .skeleton-line { height: 12px; margin: 6px 0; }
    .skeleton-block { height: 70px; margin: 12px 18px; border-radius: 12px; }
    @keyframes shimmer {
      0% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* CTA */
    .cta-bar {
      padding: 24px 22px 28px;
      position: sticky; bottom: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0) 0%, var(--bg) 30%);
    }
    .cta {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%;
      padding: 16px 20px;
      background: var(--accent);
      color: white;
      border-radius: 18px;
      font-family: var(--serif);
      font-size: 18px; font-weight: 600;
      box-shadow: 0 8px 20px rgba(233,120,218,0.35);
      transition: transform 120ms ease-out, opacity 200ms;
    }
    .cta:disabled { opacity: 0.5; cursor: not-allowed; }
    .cta:not(:disabled):active { transform: scale(0.985); }
    .cta .arrow {
      width: 36px; height: 36px; border-radius: 50%;
      background: white; color: var(--accent);
      display: flex; align-items: center; justify-content: center;
    }

    /* Modal */
    .backdrop {
      position: fixed; inset: 0;
      background: rgba(32,5,108,0.45);
      backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 50;
      animation: fadein 180ms ease-out;
    }
    .sheet {
      width: 100%; max-width: 430px;
      background: var(--bg);
      border-radius: 26px 26px 0 0;
      max-height: 92vh;
      display: flex; flex-direction: column;
      overflow: hidden;
      animation: slideup 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @media (min-width: 540px) {
      .backdrop { align-items: center; }
      .sheet { border-radius: 26px; max-height: 88vh; }
    }
    .sheet-head {
      padding: 18px 22px 12px;
      border-bottom: 1px solid var(--rule);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .sheet-head .title {
      font-family: var(--serif);
      font-size: 22px; font-weight: 600; line-height: 1.15;
      color: var(--ink);
    }
    .sheet-head .title em { font-style: italic; color: var(--brand); }
    .sheet-head .close {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--surface-3); color: var(--ink-2);
      display: flex; align-items: center; justify-content: center;
    }
    .sheet-body { overflow-y: auto; flex: 1; padding: 12px 0 22px; }

    .tier-group { padding: 18px 22px 4px; }
    .tier-label {
      font-family: var(--mono);
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--brand);
      margin-bottom: 10px;
      font-weight: 600;
    }
    .tier-group.secondary .tier-label { color: var(--accent); }
    .tier-group.promising .tier-label { color: var(--ink-3); }

    .supp {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .supp .name-row {
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    }
    .supp .name {
      font-size: 16px; font-weight: 600; color: var(--ink);
    }
    .supp .form {
      font-style: italic; color: var(--ink-3); font-size: 12px;
    }
    .supp .stats {
      display: flex; flex-wrap: wrap; gap: 10px;
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink-2);
    }
    .supp .stats .pill {
      background: var(--surface-2);
      padding: 4px 8px; border-radius: 6px;
    }
    .supp .evidence {
      font-size: 13px; color: var(--ink-2); line-height: 1.45;
      margin-top: 8px;
    }
    .supp .buy {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 10px;
      padding: 8px 14px;
      background: var(--brand);
      color: white;
      border-radius: 999px;
      font-size: 13px; font-weight: 600;
    }
    .supp .buy:hover { background: var(--brand-deep); }

    @keyframes fadein {
      from { opacity: 0; } to { opacity: 1; }
    }
    @keyframes slideup {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    .error {
      margin: 22px;
      padding: 14px 16px;
      background: var(--accent-soft);
      color: var(--brand-deep);
      border-radius: 12px;
      font-size: 13px;
    }
    .footnote {
      padding: 16px 22px 28px;
      font-size: 11px; color: var(--ink-3); text-align: center;
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>

  <script>
    // -----------------------------------------------------------------------
    // Topic registry. Slugs match the BM25 source labels in retrieval.py, so a
    // tile that's "live" can just navigate to /api/category/<slug>. Only
    // memory-focus is wired up for the MVP slice; the others render but are
    // inert ("Coming soon") until we author the data + smoke-test each one.
    // -----------------------------------------------------------------------
    const LIVE_SLUGS = new Set(['memory-focus']);
    const TOPICS = [
      { slug: 'sleep',                 name: 'Sleep',           icon: 'moon' },
      { slug: 'stress-anxiety',        name: 'Stress',          icon: 'leaf' },
      { slug: 'memory-focus',          name: 'Memory & Focus',  icon: 'brain' },
      { slug: 'mood-depression',       name: 'Mood',            icon: 'sun' },
      { slug: 'muscle-gain',           name: 'Muscle',          icon: 'dumbbell' },
      { slug: 'fat-loss',              name: 'Fat loss',        icon: 'flame' },
      { slug: 'cardiovascular-health', name: 'Heart',           icon: 'heart' },
      { slug: 'joint-health',          name: 'Joints',          icon: 'bone' },
      { slug: 'allergies-immunity',    name: 'Immunity',        icon: 'shield' },
      { slug: 'skin-hair-nails',       name: 'Skin',            icon: 'droplet' },
      { slug: 'libido',                name: 'Libido',          icon: 'spark' },
      { slug: 'liver-health',          name: 'Liver',           icon: 'leaf' },
      { slug: 'bone-health',           name: 'Bones',           icon: 'bone' },
      { slug: 'blood-sugar',           name: 'Blood sugar',     icon: 'droplet' },
      { slug: 'testosterone',          name: 'Testosterone',    icon: 'flame' },
      { slug: 'recovery-wellness',     name: 'Recovery',        icon: 'heart' },
      { slug: 'vegetarians-vegans',    name: 'Vegetarian',      icon: 'leaf' },
      { slug: 'healthy-aging',         name: 'Healthy aging',   icon: 'sun' },
    ];

    // Inline SVGs lifted (and trimmed) from Balance App v2.html so the look
    // matches the design without pulling an icon library.
    const ICONS = {
      moon:     '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14A8 8 0 019 3a9 9 0 1011 11z"/></svg>',
      leaf:     '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4c-10 0-16 6-16 14 0 1 0 1.5.5 2.5C6 17 10 14 16 12c-5 4-8 7-10 10 8 0 14-5 14-14V4z"/></svg>',
      brain:    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 4a3 3 0 00-3 3 3 3 0 00-2 5 3 3 0 002 5 3 3 0 006 0V4z" fill="currentColor" stroke="none"/><path d="M15 4a3 3 0 013 3 3 3 0 012 5 3 3 0 01-2 5 3 3 0 01-6 0V4z" fill="currentColor" stroke="none" opacity="0.55"/></svg>',
      sun:      '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.5 4.5l2 2M17.5 17.5l2 2M4.5 19.5l2-2M17.5 6.5l2-2"/></g></svg>',
      dumbbell: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="5" y="7" width="3" height="10" rx="1"/><rect x="8" y="11" width="8" height="2"/><rect x="16" y="7" width="3" height="10" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/></svg>',
      flame:    '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s5 5 5 10a5 5 0 01-10 0c0-2 1-3 1-3s-1 5 2 5 3-4 2-6c3 2 4 5 4 7a6 6 0 11-12 0c0-6 8-13 8-13z"/></svg>',
      heart:    '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5-8-11a5 5 0 019-3 5 5 0 019 3c0 6-8 11-8 11z"/></svg>',
      bone:     '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4a3 3 0 012 5l3 3-3 3a3 3 0 11-5 2 3 3 0 110-6 3 3 0 013-7zm10 0a3 3 0 00-2 5l3 3-3 3a3 3 0 105 2 3 3 0 100-6 3 3 0 00-3-7z" transform="rotate(45 12 12)"/></svg>',
      shield:   '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l8 3v7c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V5l8-3z"/></svg>',
      droplet:  '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3s7 7 7 12a7 7 0 11-14 0c0-5 7-12 7-12z"/></svg>',
      spark:    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg>',
      back:     '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
      arrow:    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
      close:    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
      external: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5"/><path d="M19 5l-9 9"/><path d="M19 14v5H5V5h5"/></svg>',
    };
    const icon = (k) => ICONS[k] || '';

    // -----------------------------------------------------------------------
    // App state + tiny hash router.
    // -----------------------------------------------------------------------
    const state = {
      view: 'home',     // 'home' | 'detail'
      slug: null,
      data: null,       // CategoryResponse for the current slug
      loading: false,
      error: null,
      modalOpen: false,
    };
    const cache = new Map();  // slug -> CategoryResponse

    function escapeHtml(s) {
      return (s ?? '').replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
      );
    }

    function navigate(hash) {
      if (window.location.hash !== hash) {
        window.location.hash = hash;
      } else {
        applyRoute();
      }
    }

    function applyRoute() {
      const hash = window.location.hash || '#/';
      const m = hash.match(/^#\/category\/([\w-]+)$/);
      if (m && LIVE_SLUGS.has(m[1])) {
        state.view = 'detail';
        state.slug = m[1];
        state.modalOpen = false;
        if (cache.has(state.slug)) {
          state.data = cache.get(state.slug);
          state.error = null;
          state.loading = false;
        } else {
          state.data = null;
          state.error = null;
          state.loading = true;
          fetchCategory(state.slug);
        }
      } else {
        state.view = 'home';
        state.slug = null;
        state.data = null;
        state.error = null;
        state.loading = false;
        state.modalOpen = false;
      }
      render();
    }

    async function fetchCategory(slug) {
      try {
        const res = await fetch(`/api/category/${slug}`);
        if (!res.ok) {
          let detail = `Status ${res.status}`;
          try { const j = await res.json(); detail = j.detail || detail; } catch {}
          throw new Error(detail);
        }
        const data = await res.json();
        cache.set(slug, data);
        if (state.view === 'detail' && state.slug === slug) {
          state.data = data;
          state.loading = false;
          state.error = null;
          render();
        }
      } catch (err) {
        if (state.view === 'detail' && state.slug === slug) {
          state.loading = false;
          state.error = String(err.message || err);
          render();
        }
      }
    }

    function openModal() {
      if (!state.data) return;
      state.modalOpen = true;
      render();
    }
    function closeModal() {
      state.modalOpen = false;
      render();
    }

    // -----------------------------------------------------------------------
    // Rendering
    // -----------------------------------------------------------------------
    function renderHome() {
      const tiles = TOPICS.map((t) => {
        const live = LIVE_SLUGS.has(t.slug);
        return `
          <div class="tile ${live ? 'live' : 'coming'}"
               role="button"
               tabindex="${live ? 0 : -1}"
               data-slug="${t.slug}"
               data-live="${live}">
            <span class="badge">${live ? 'New' : 'Soon'}</span>
            <div class="icon-wrap">${icon(t.icon)}</div>
            <div>
              <div class="name">${escapeHtml(t.name)}</div>
              <div class="meta">${live ? 'TAP TO OPEN' : 'COMING SOON'}</div>
            </div>
          </div>`;
      }).join('');

      return `
        <div class="topbar">
          <div class="brand">Balance<em>.ai</em></div>
          <a class="ask-link" href="/chat" title="Open the chat assistant">
            ${icon('spark')} Ask
          </a>
        </div>
        <div class="hero">
          <h1>Learn what <em>actually</em> works.</h1>
          <div class="sub">18 evidence-based wellbeing guides · pick a goal to build your stack.</div>
        </div>
        <div class="grid" id="grid">${tiles}</div>
        <div class="footnote">Educational only — always check with your healthcare provider before starting any new supplement.</div>
      `;
    }

    function renderDetailSkeleton() {
      return `
        <div class="section"><h2>What hurts <em>memory &amp; focus</em></h2>
          <div class="card">
            <div class="skeleton-block"></div>
            <div class="skeleton-block"></div>
            <div class="skeleton-block"></div>
          </div>
        </div>
        <div class="section"><h2>What you can <em>do</em></h2>
          <div class="card">
            <div class="skeleton-block"></div>
            <div class="skeleton-block"></div>
            <div class="skeleton-block"></div>
          </div>
        </div>
      `;
    }

    function renderDetail() {
      const data = state.data;
      const title = data?.title || 'Memory & Focus';
      const titleParts = title.split(' ');
      const heroTitleHtml =
        titleParts.length > 1
          ? `${escapeHtml(titleParts[0])} <em>${escapeHtml(titleParts.slice(1).join(' '))}</em>`
          : escapeHtml(title);

      const renderList = (items, kind) =>
        (items || [])
          .map(
            (it, i) => `
            <div class="item ${kind}">
              <div class="marker">${(i + 1).toString().padStart(2, '0')}</div>
              <div>
                <div class="title">${escapeHtml(it.title)}</div>
                <div class="desc">${escapeHtml(it.description)}</div>
              </div>
            </div>`
          )
          .join('');

      const body = state.error
        ? `<div class="error">Couldn't load this guide: ${escapeHtml(state.error)}</div>`
        : state.loading || !data
          ? renderDetailSkeleton()
          : `
            <div class="section"><h2>What hurts <em>${escapeHtml(title.toLowerCase())}</em></h2>
              <div class="card">${renderList(data.problems, 'problem')}</div>
            </div>
            <div class="section"><h2>What you can <em>do</em></h2>
              <div class="card">${renderList(data.what_you_can_do, 'lever')}</div>
            </div>`;

      const ctaDisabled = !data || state.loading || state.error;
      const ctaLabel = state.loading
        ? 'Building your stack…'
        : 'Build my supplement stack';

      return `
        <div class="detail-hero">
          <div class="row">
            <button class="iconbtn" data-back aria-label="Back">${icon('back')}</button>
            <a class="iconbtn" href="/chat" aria-label="Ask">${icon('spark')}</a>
          </div>
          <div class="eyebrow">Evidence-based guide</div>
          <h1>${heroTitleHtml}</h1>
          <div class="tag">An AI-built stack from the supplement guide — tiered by evidence, with how to take each one.</div>
        </div>
        ${body}
        <div class="cta-bar">
          <button class="cta" data-cta ${ctaDisabled ? 'disabled' : ''}>
            <span>${ctaLabel}</span>
            <span class="arrow">${icon('arrow')}</span>
          </button>
        </div>
      `;
    }

    function renderModal() {
      const data = state.data;
      if (!state.modalOpen || !data) return '';
      const tiers = ['Primary', 'Secondary', 'Promising'];
      const byTier = Object.fromEntries(tiers.map((t) => [t, []]));
      for (const s of data.supplements) {
        if (byTier[s.tier]) byTier[s.tier].push(s);
      }
      const renderSupp = (s) => `
        <div class="supp">
          <div class="name-row">
            <div class="name">${escapeHtml(s.name)}</div>
            ${s.form ? `<div class="form">${escapeHtml(s.form)}</div>` : ''}
          </div>
          <div class="stats">
            <span class="pill">${escapeHtml(s.dose)}</span>
            ${s.timing ? `<span class="pill">${escapeHtml(s.timing)}</span>` : ''}
          </div>
          ${s.evidence ? `<div class="evidence">${escapeHtml(s.evidence)}</div>` : ''}
          <a class="buy" href="${escapeHtml(s.iherb_url)}" target="_blank" rel="noopener noreferrer">
            Buy on iHerb ${icon('external')}
          </a>
        </div>`;

      const groups = tiers
        .filter((t) => byTier[t].length)
        .map(
          (t) => `
          <div class="tier-group ${t.toLowerCase()}">
            <div class="tier-label">${t} supplements</div>
            ${byTier[t].map(renderSupp).join('')}
          </div>`
        )
        .join('');

      return `
        <div class="backdrop" data-close>
          <div class="sheet" role="dialog" aria-modal="true" aria-label="Recommended stack">
            <div class="sheet-head">
              <div class="title">Recommended stack for <em>${escapeHtml(data.title)}</em></div>
              <button class="close" data-close aria-label="Close">${icon('close')}</button>
            </div>
            <div class="sheet-body">
              ${groups || '<div class="error" style="margin:18px 22px">No supplements parsed for this guide yet.</div>'}
              <div class="footnote">
                Always check with your healthcare provider before starting any new supplement,
                especially if you take medication or have a health condition.
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById('app');
      const main = state.view === 'detail' ? renderDetail() : renderHome();
      root.innerHTML = main + renderModal();
      attachHandlers();
      // Lock body scroll while modal is open.
      document.body.style.overflow = state.modalOpen ? 'hidden' : '';
    }

    function attachHandlers() {
      // Topic tiles
      document.querySelectorAll('.tile.live').forEach((el) => {
        const slug = el.dataset.slug;
        const go = () => navigate(`#/category/${slug}`);
        el.addEventListener('click', go);
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
        });
      });
      // Back
      const backBtn = document.querySelector('[data-back]');
      if (backBtn) backBtn.addEventListener('click', () => navigate('#/'));
      // CTA
      const cta = document.querySelector('[data-cta]');
      if (cta && !cta.disabled) cta.addEventListener('click', openModal);
      // Modal close
      document.querySelectorAll('[data-close]').forEach((el) => {
        el.addEventListener('click', (e) => {
          if (e.target === el || el.tagName === 'BUTTON') closeModal();
        });
      });
      // Escape to close modal
      if (state.modalOpen) {
        document.addEventListener('keydown', escClose, { once: true });
      }
    }
    function escClose(e) { if (e.key === 'Escape') closeModal(); }

    window.addEventListener('hashchange', applyRoute);
    applyRoute();
  </script>
</body>
</html>

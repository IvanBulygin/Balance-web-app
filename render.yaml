envVarGroups:
  - name: balance-ai-secrets
    envVars:
      - key: OPENAI_API_KEY
        sync: false

services:
  - type: web
    name: balance-ai-project-agent
    runtime: python
    rootDir: agent_site
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - fromGroup: balance-ai-secrets
      - key: PYTHON_VERSION
        value: "3.11"

  - type: web
    name: balance-ai-rag-demo
    runtime: python
    rootDir: rag_demo
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - fromGroup: balance-ai-secrets
      - key: PYTHON_VERSION
        value: "3.11"
